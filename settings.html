<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Настройки — Органайзер</title>
    
    <link rel="stylesheet" href="./css/variables.css">
    <link rel="stylesheet" href="./css/global.css">
    <link rel="stylesheet" href="./css/layout.css">
    <style>
        body.font-modern { font-family: system-ui, -apple-system, sans-serif; }
        body.font-neon { font-family: 'Courier New', Courier, monospace; letter-spacing: 0.5px; }
        body.font-retro { font-family: 'Lucida Console', Monaco, monospace; text-transform: uppercase; font-size: 0.9rem; }

        body.glow-enabled.glow-blue .setting-section {
            border-color: rgba(96, 165, 250, 0.5);
            box-shadow: 0 0 25px rgba(59, 130, 246, 0.35), 0 20px 50px rgba(0, 0, 0, 0.4) !important;
        }
        body.glow-enabled.glow-purple .setting-section {
            border-color: rgba(192, 132, 252, 0.5);
            box-shadow: 0 0 25px rgba(168, 85, 247, 0.35), 0 20px 50px rgba(0, 0, 0, 0.4) !important;
        }
        body.glow-enabled.glow-green .setting-section {
            border-color: rgba(74, 222, 128, 0.5);
            box-shadow: 0 0 25px rgba(34, 197, 94, 0.35), 0 20px 50px rgba(0, 0, 0, 0.4) !important;
        }
        body.glow-enabled.glow-pink .setting-section {
            border-color: rgba(244, 114, 182, 0.5);
            box-shadow: 0 0 25px rgba(236, 72, 153, 0.35), 0 20px 50px rgba(0, 0, 0, 0.4) !important;
        }
        body.glow-enabled.glow-custom .setting-section {
            border-color: var(--custom-glow-border, rgba(59, 130, 246, 0.5));
            box-shadow: 0 0 25px var(--custom-glow-shadow, rgba(59, 130, 246, 0.35)), 0 20px 50px rgba(0, 0, 0, 0.4) !important;
        }

        .settings-container {
            max-width: 850px;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }
        .setting-section {
            background: rgba(15, 23, 42, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.08);
            padding: 24px;
            border-radius: 14px;
            backdrop-filter: blur(10px);
            transition: all 0.3s ease;
        }
        .setting-section h3 {
            font-size: 1.1rem;
            color: #f8fafc;
            margin-bottom: 16px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .setting-item {
            margin-bottom: 16px;
        }
        .setting-item:last-child {
            margin-bottom: 0;
        }
        .setting-item label {
            display: block;
            margin-bottom: 8px;
            color: #94a3b8;
            font-size: 0.9rem;
        }
        .setting-input, .setting-select {
            width: 100%;
            background: rgba(15, 23, 42, 0.7);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: #fff;
            padding: 12px;
            border-radius: 8px;
            font-size: 0.95rem;
            outline: none;
            transition: border-color 0.2s;
        }
        .setting-input:focus, .setting-select:focus {
            border-color: #60a5fa;
        }
        .range-slider-wrap {
            display: flex;
            align-items: center;
            gap: 15px;
        }
        .range-slider-wrap input[type="range"] {
            flex: 1;
            accent-color: #3b82f6;
            cursor: pointer;
        }
        .range-value {
            font-size: 0.9rem;
            color: #60a5fa;
            width: 45px;
            text-align: right;
        }
        .file-drop-area {
            border: 2px dashed rgba(255, 255, 255, 0.15);
            padding: 20px;
            border-radius: 10px;
            text-align: center;
            cursor: pointer;
            transition: all 0.2s;
            background: rgba(255, 255, 255, 0.02);
        }
        .file-drop-area:hover {
            border-color: #60a5fa;
            background: rgba(255, 255, 255, 0.05);
        }
        #bgFilePicker {
            display: none;
        }
    </style>
</head>
<body>

    <div id="bgContainer" style="position: fixed; inset: 0; z-index: -2; overflow: hidden;"></div>
    <div id="videoOverlay" style="position: fixed; inset: 0; z-index: -1; background: rgba(11, 15, 25, 0.85);"></div>

    <header class="site-header">
        <div class="header-container">
            <a href="calendar.html" class="logo">📅 Органайзер</a>
            <nav class="nav-menu">
                <a href="calendar.html">Календарь и Заметки</a>
                <a href="index.html">Расписание</a>
                <a href="settings.html" class="active">Настройки</a>
            </nav>
        </div>
    </header>

    <main class="site-main">
        <div class="settings-container">
            
            <div style="margin-bottom: 10px;">
                <h1 style="font-size: 1.8rem; margin-bottom: 6px;">Настройки приложения</h1>
                <p class="subtitle" style="margin: 0;">Персонализация внешнего вида, медиа-фона и интеграций.</p>
            </div>

            <div class="setting-section">
                <h3>🎨 Интерфейс и Оформление</h3>
                
                <div class="setting-item">
                    <label>Telegram ID администраторов:</label>
                    <input type="text" class="setting-input" value="1320294475, 5619340928, 8870678654" readonly>
                </div>

                <div class="setting-item">
                    <label for="fontSelect">Стиль шрифта интерфейса:</label>
                    <select id="fontSelect" class="setting-select">
                        <option value="modern">Современный (Modern / Clean)</option>
                        <option value="neon">Неоновый (Cyberpunk / Tech)</option>
                        <option value="retro">Ретро (Terminal / Mono)</option>
                    </select>
                </div>

                <div class="setting-item" style="display: flex; align-items: center; gap: 10px; padding-top: 5px;">
                    <input type="checkbox" id="glowCheckbox" style="width: 18px; height: 18px; cursor: pointer;">
                    <label for="glowCheckbox" style="margin: 0; color: #f8fafc; cursor: pointer;">Включить атмосферное свечение карточек</label>
                </div>

                <div class="setting-item" style="margin-top: 15px;">
                    <label for="glowColorSelect">Цвет свечения:</label>
                    <select id="glowColorSelect" class="setting-select" style="margin-bottom: 10px;">
                        <option value="blue">Электрический синий</option>
                        <option value="purple">Электрический фиолетовый</option>
                        <option value="green">Неоновый зеленый</option>
                        <option value="pink">Неоновый розовый</option>
                        <option value="custom">Свой цвет (палитра)</option>
                        <option value="none">Без фона / Выкл</option>
                    </select>

                    <div id="customColorWrap" style="display: none; align-items: center; gap: 10px;">
                        <input type="color" id="customColorPicker" value="#3b82f6" style="width: 45px; height: 38px; border: none; border-radius: 8px; background: none; cursor: pointer;">
                        <span style="font-size: 0.85rem; color: #94a3b8;">Выберите свой оттенок для свечения</span>
                    </div>
                </div>

                <div class="setting-item" style="margin-top: 15px;">
                    <label for="overlayOpacityRange">Затемнение фона (прозрачность подложки):</label>
                    <div class="range-slider-wrap">
                        <input type="range" id="overlayOpacityRange" min="0" max="1" step="0.05" value="0.85">
                        <span class="range-value" id="opacityVal">85%</span>
                    </div>
                </div>

                <div class="setting-item" style="margin-top: 15px;">
                    <label for="bgBlurRange">Размытие фона (Blur):</label>
                    <div class="range-slider-wrap">
                        <input type="range" id="bgBlurRange" min="0" max="20" step="1" value="0">
                        <span class="range-value" id="blurVal">0px</span>
                    </div>
                </div>
            </div>

            <div class="setting-section">
                <h3>🖼️ Фоновый медиафайл (Фото или MP4)</h3>
                <div class="setting-item">
                    <label class="file-drop-area" for="bgFilePicker">
                        <span style="font-size: 1.1rem; display: block; margin-bottom: 4px; color: #fff;">📂 Нажмите для выбора файла фона</span>
                        <span style="font-size: 0.85rem; color: #94a3b8;" id="bgFileNamePreview">Поддерживаются изображения или MP4 видео</span>
                    </label>
                    <input type="file" id="bgFilePicker" accept="image/*,video/mp4">
                </div>
            </div>

            <button class="btn-accent" id="saveSettingsBtn" style="width: 100%; padding: 14px; font-size: 1rem; border-radius: 10px; cursor: pointer;">Сохранить все настройки</button>
        </div>
    </main>

    <script>
        const fontSelect = document.getElementById('fontSelect');
        const glowCheckbox = document.getElementById('glowCheckbox');
        const glowColorSelect = document.getElementById('glowColorSelect');
        const customColorWrap = document.getElementById('customColorWrap');
        const customColorPicker = document.getElementById('customColorPicker');
        const overlayOpacityRange = document.getElementById('overlayOpacityRange');
        const opacityVal = document.getElementById('opacityVal');
        const bgBlurRange = document.getElementById('bgBlurRange');
        const blurVal = document.getElementById('blurVal');
        const saveSettingsBtn = document.getElementById('saveSettingsBtn');
        const bgFilePicker = document.getElementById('bgFilePicker');
        const bgFileNamePreview = document.getElementById('bgFileNamePreview');
        const bgContainer = document.getElementById('bgContainer');
        const videoOverlay = document.getElementById('videoOverlay');

        // Чтение настроек
        const savedFont = localStorage.getItem('appFontStyle') || 'modern';
        const savedGlow = localStorage.getItem('appGlow') === 'true';
        const savedGlowColor = localStorage.getItem('appGlowColor') || 'blue';
        const savedCustomColor = localStorage.getItem('appCustomGlowColor') || '#3b82f6';
        const savedOpacity = localStorage.getItem('appBgOpacity') ?? '0.85';
        const savedBlur = localStorage.getItem('appBgBlur') || '0';

        fontSelect.value = savedFont;
        glowCheckbox.checked = savedGlow;
        overlayOpacityRange.value = savedOpacity;
        opacityVal.textContent = Math.round(savedOpacity * 100) + '%';
        bgBlurRange.value = savedBlur;
        blurVal.textContent = savedBlur + 'px';

        videoOverlay.style.background = `rgba(11, 15, 25, ${savedOpacity})`;
        bgContainer.style.filter = `blur(${savedBlur}px)`;

        if (savedGlowColor === 'custom') {
            glowColorSelect.value = 'custom';
            customColorWrap.style.display = 'flex';
            customColorPicker.value = savedCustomColor;
            applyCustomGlow(savedCustomColor);
        } else {
            glowColorSelect.value = savedGlowColor;
        }

        document.body.classList.add(`font-${savedFont}`);
        if (savedGlow && savedGlowColor !== 'none') {
            document.body.classList.add('glow-enabled', `glow-${savedGlowColor}`);
        }

        function applyCustomGlow(hexColor) {
            let r = parseInt(hexColor.slice(1, 3), 16) || 59;
            let g = parseInt(hexColor.slice(3, 5), 16) || 130;
            let b = parseInt(hexColor.slice(5, 7), 16) || 246;
            document.documentElement.style.setProperty('--custom-glow-border', `rgba(${r}, ${g}, ${b}, 0.5)`);
            document.documentElement.style.setProperty('--custom-glow-shadow', `rgba(${r}, ${g}, ${b}, 0.35)`);
        }

        function updateBodyGlowClasses(color, isEnabled) {
            document.body.classList.remove('glow-enabled', 'glow-blue', 'glow-purple', 'glow-green', 'glow-pink', 'glow-custom');
            if (isEnabled && color !== 'none') {
                document.body.classList.add('glow-enabled', `glow-${color}`);
            }
        }

        overlayOpacityRange.addEventListener('input', (e) => {
            const val = e.target.value;
            opacityVal.textContent = Math.round(val * 100) + '%';
            videoOverlay.style.background = `rgba(11, 15, 25, ${val})`;
        });

        bgBlurRange.addEventListener('input', (e) => {
            const val = e.target.value;
            blurVal.textContent = val + 'px';
            bgContainer.style.filter = `blur(${val}px)`;
        });

        function renderBackground(dataUrl, fileType = '') {
            bgContainer.innerHTML = '';
            if (dataUrl) {
                const isVideo = fileType.startsWith('video') || (typeof dataUrl === 'string' && (dataUrl.includes('data:video') || dataUrl.endsWith('.mp4')));
                if (isVideo) {
                    const video = document.createElement('video');
                    video.src = dataUrl;
                    video.autoplay = true;
                    video.muted = true;
                    video.loop = true;
                    video.style.cssText = 'width: 100%; height: 100%; object-fit: cover; transform: scale(1.02);';
                    bgContainer.appendChild(video);
                } else {
                    const img = document.createElement('img');
                    img.src = dataUrl;
                    img.style.cssText = 'width: 100%; height: 100%; object-fit: cover; transform: scale(1.02);';
                    bgContainer.appendChild(img);
                }
            } else {
                const video = document.createElement('video');
                video.src = 'assets/background.mp4';
                video.autoplay = true;
                video.muted = true;
                video.loop = true;
                video.style.cssText = 'width: 100%; height: 100%; object-fit: cover; transform: scale(1.02);';
                bgContainer.appendChild(video);
            }
        }

        // Загрузка из IndexedDB
        const dbPromise = indexedDB.open('OrganizerDB', 2);
        dbPromise.onsuccess = () => {
            const db = dbPromise.result;
            if (!db.objectStoreNames.contains('files')) return;
            const tx = db.transaction('files', 'readonly');
            const store = tx.objectStore('files');
            const req = store.get('backgroundData');
            req.onsuccess = () => {
                if (req.result) {
                    renderBackground(req.result.data, req.result.type);
                    bgFileNamePreview.textContent = `Фон загружен из памяти (${req.result.name || 'файл'})`;
                } else {
                    renderBackground(null);
                }
            };
        };

        let pendingBackgroundData = null;

        bgFilePicker.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (file) {
                bgFileNamePreview.textContent = `Выбран файл: ${file.name}`;
                const reader = new FileReader();
                reader.onload = function(event) {
                    pendingBackgroundData = {
                        data: event.target.result,
                        type: file.type,
                        name: file.name
                    };
                    renderBackground(pendingBackgroundData.data, pendingBackgroundData.type);
                };
                reader.readAsDataURL(file);
            }
        });

        glowColorSelect.addEventListener('change', (e) => {
            const val = e.target.value;
            if (val === 'custom') {
                customColorWrap.style.display = 'flex';
                applyCustomGlow(customColorPicker.value);
            } else {
                customColorWrap.style.display = 'none';
            }
            if (val === 'none') glowCheckbox.checked = false;
            else glowCheckbox.checked = true;
            updateBodyGlowClasses(val, glowCheckbox.checked);
        });

        customColorPicker.addEventListener('input', (e) => {
            applyCustomGlow(e.target.value);
            updateBodyGlowClasses('custom', glowCheckbox.checked);
        });

        glowCheckbox.addEventListener('change', (e) => {
            updateBodyGlowClasses(glowColorSelect.value, e.target.checked);
        });

        saveSettingsBtn.addEventListener('click', async () => {
            localStorage.setItem('appFontStyle', fontSelect.value);
            localStorage.setItem('appGlow', glowCheckbox.checked);
            localStorage.setItem('appGlowColor', glowColorSelect.value);
            localStorage.setItem('appBgOpacity', overlayOpacityRange.value);
            localStorage.setItem('appBgBlur', bgBlurRange.value);
            
            if (glowColorSelect.value === 'custom') {
                localStorage.setItem('appCustomGlowColor', customColorPicker.value);
            }

            if (pendingBackgroundData) {
                const db = dbPromise.result;
                const tx = db.transaction('files', 'readwrite');
                const store = tx.objectStore('files');
                store.put(pendingBackgroundData, 'backgroundData');
            }

            alert('Настройки успешно сохранены!');
            location.reload();
        });
    </script>
</body>
</html>
