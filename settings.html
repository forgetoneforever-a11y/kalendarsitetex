<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Настройки — Органайзер</title>
    
    <link rel="stylesheet" href="./css/variables.css">
    <link rel="stylesheet" href="./css/global.css">
    <link rel="stylesheet" href="./css/layout.css">
    <style>
        /* Стили шрифтов */
        body.font-modern { font-family: system-ui, -apple-system, sans-serif; }
        body.font-neon { font-family: 'Courier New', Courier, monospace; letter-spacing: 0.5px; }
        body.font-retro { font-family: 'Lucida Console', Monaco, monospace; text-transform: uppercase; font-size: 0.9rem; }

        /* Динамическое свечение по цветам */
        body.glow-enabled.glow-blue .card-glass, 
        body.glow-enabled.glow-blue .settings-card, 
        body.glow-enabled.glow-blue .calendar-widget {
            border-color: rgba(96, 165, 250, 0.5);
            box-shadow: 0 0 25px rgba(59, 130, 246, 0.35), 0 20px 50px rgba(0, 0, 0, 0.4) !important;
        }
        body.glow-enabled.glow-purple .card-glass, 
        body.glow-enabled.glow-purple .settings-card, 
        body.glow-enabled.glow-purple .calendar-widget {
            border-color: rgba(192, 132, 252, 0.5);
            box-shadow: 0 0 25px rgba(168, 85, 247, 0.35), 0 20px 50px rgba(0, 0, 0, 0.4) !important;
        }
        body.glow-enabled.glow-green .card-glass, 
        body.glow-enabled.glow-green .settings-card, 
        body.glow-enabled.glow-green .calendar-widget {
            border-color: rgba(74, 222, 128, 0.5);
            box-shadow: 0 0 25px rgba(34, 197, 94, 0.35), 0 20px 50px rgba(0, 0, 0, 0.4) !important;
        }
        body.glow-enabled.glow-pink .card-glass, 
        body.glow-enabled.glow-pink .settings-card, 
        body.glow-enabled.glow-pink .calendar-widget {
            border-color: rgba(244, 114, 182, 0.5);
            box-shadow: 0 0 25px rgba(236, 72, 153, 0.35), 0 20px 50px rgba(0, 0, 0, 0.4) !important;
        }

        .setting-item select {
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 14px 16px;
            border-radius: 12px;
            color: #f8fafc;
            font-size: 0.95rem;
            width: 100%;
            cursor: pointer;
        }
        .setting-item select:focus {
            outline: none;
            border-color: #60a5fa;
            box-shadow: 0 0 0 3px rgba(96, 165, 250, 0.15);
        }
        .toggle-wrapper {
            display: flex;
            align-items: center;
            gap: 12px;
            cursor: pointer;
            color: #f8fafc;
            font-size: 0.95rem;
        }
        .toggle-wrapper input {
            width: 20px;
            height: 20px;
            accent-color: #3b82f6;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <video autoplay muted loop id="bgVideo">
        <source src="assets/background.mp4" type="video/mp4">
    </video>
    <div class="video-overlay"></div>

    <header class="site-header">
        <header class="header-container">
            <a href="index.html" class="logo">📅 Органайзер</a>
            <nav class="nav-menu">
                <a href="index.html">Расписание</a>
                <a href="calendar.html">Календарь и Заметки</a>
                <a href="settings.html" class="active">Настройки</a>
            </nav>
        </div>
    </header>

    <main class="site-main">
        <section class="settings-card">
            <h1>Настройки приложения</h1>
            
            <div class="setting-item">
                <label>Telegram ID администраторов / получателя:</label>
                <input type="text" value="1320294475, 5619340928, 8870678654" readonly>
            </div>

            <div class="setting-item">
                <label>Стиль шрифта интерфейса:</label>
                <select id="fontStyleSelect">
                    <option value="modern">Строгий (Modern Sans)</option>
                    <option value="neon">Неоновый (Cyberpunk / Tech)</option>
                    <option value="retro">Ретро (Terminal / Arcade)</option>
                </select>
            </div>

            <div class="setting-item">
                <label>Эффект свечения (Neon Glow):</label>
                <label class="toggle-wrapper">
                    <input type="checkbox" id="glowToggle"> Включить атмосферное свечение карточек
                </label>
            </div>

            <div class="setting-item">
                <label>Цвет свечения:</label>
                <select id="glowColorSelect">
                    <option value="blue">Неоновый синий</option>
                    <option value="purple">Электрический фиолетовый</option>
                    <option value="green">Киберпанк зеленый</option>
                    <option value="pink">Неоновый розовый</option>
                </select>
            </div>
            
            <div class="setting-item">
                <label>Фоновое MP4 видео:</label>
                <input type="file" accept="video/mp4">
            </div>

            <button class="btn-accent" id="saveSettingsBtn">Сохранить настройки</button>
        </section>
    </main>

    <script>
        const fontStyleSelect = document.getElementById('fontStyleSelect');
        const glowToggle = document.getElementById('glowToggle');
        const glowColorSelect = document.getElementById('glowColorSelect');
        const saveSettingsBtn = document.getElementById('saveSettingsBtn');

        // Функция применения стилей прямо на странице
        function applyStylesLive() {
            document.body.className = ''; // Сбрасываем классы
            document.body.classList.add(`font-${fontStyleSelect.value}`);
            if (glowToggle.checked) {
                document.body.classList.add('glow-enabled');
                document.body.classList.add(`glow-${glowColorSelect.value}`);
            }
        }

        // Загрузка сохраненных настроек при открытии
        if (localStorage.getItem('appFontStyle')) {
            fontStyleSelect.value = localStorage.getItem('appFontStyle');
        }
        if (localStorage.getItem('appGlow') === 'true') {
            glowToggle.checked = true;
        }
        if (localStorage.getItem('appGlowColor')) {
            glowColorSelect.value = localStorage.getItem('appGlowColor');
        }

        applyStylesLive();

        // Живое обновление при изменении полей
        fontStyleSelect.addEventListener('change', applyStylesLive);
        glowToggle.addEventListener('change', applyStylesLive);
        glowColorSelect.addEventListener('change', applyStylesLive);

        // Сохранение в localStorage
        saveSettingsBtn.addEventListener('click', () => {
            localStorage.setItem('appFontStyle', fontStyleSelect.value);
            localStorage.setItem('appGlow', glowToggle.checked);
            localStorage.setItem('appGlowColor', glowColorSelect.value);
            alert('Настройки успешно сохранены и применены ко всем страницам!');
        });
    </script>
</body>
</html>
