<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Расписание — Texnikum work</title>
    
    <link rel="stylesheet" href="./css/variables.css">
    <link rel="stylesheet" href="./css/global.css">
    <link rel="stylesheet" href="./css/layout.css">
    <style>
        body.font-modern { font-family: system-ui, -apple-system, sans-serif; }
        body.font-neon { font-family: 'Courier New', Courier, monospace; letter-spacing: 0.5px; }
        body.font-retro { font-family: 'Lucida Console', Monaco, monospace; text-transform: uppercase; font-size: 0.9rem; }

        /* Стильная полупрозрачная шапка */
        .site-header {
            position: sticky;
            top: 0;
            z-index: 50;
            background: rgba(15, 23, 42, 0.45) !important;
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.3);
        }
        .header-container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 14px 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .logo {
            font-size: 1.1rem;
            font-weight: 700;
            color: #f8fafc;
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 8px;
            letter-spacing: 0.3px;
        }
        .nav-menu { display: flex; gap: 8px; }
        .nav-menu a {
            color: #94a3b8;
            text-decoration: none;
            padding: 8px 16px;
            border-radius: 8px;
            font-size: 0.9rem;
            font-weight: 500;
            transition: all 0.2s ease;
        }
        .nav-menu a:hover { color: #fff; background: rgba(255, 255, 255, 0.06); }
        .nav-menu a.active {
            color: #fff;
            background: rgba(59, 130, 246, 0.2);
            border: 1px solid rgba(59, 130, 246, 0.3);
            box-shadow: 0 0 15px rgba(59, 130, 246, 0.2);
        }

        /* Применение динамического размытия панелей */
        .card-glass, .schedule-day-card {
            background: rgba(15, 23, 42, 0.55);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 14px;
            backdrop-filter: blur(var(--card-blur, 10px));
            -webkit-backdrop-filter: blur(var(--card-blur, 10px));
        }

        body.glow-enabled.glow-blue .card-glass, body.glow-enabled.glow-blue .schedule-day-card {
            border-color: rgba(96, 165, 250, 0.5);
            box-shadow: 0 0 25px rgba(59, 130, 246, 0.35), 0 20px 50px rgba(0, 0, 0, 0.4) !important;
        }
        body.glow-enabled.glow-purple .card-glass, body.glow-enabled.glow-purple .schedule-day-card {
            border-color: rgba(192, 132, 252, 0.5);
            box-shadow: 0 0 25px rgba(168, 85, 247, 0.35), 0 20px 50px rgba(0, 0, 0, 0.4) !important;
        }
        body.glow-enabled.glow-green .card-glass, body.glow-enabled.glow-green .schedule-day-card {
            border-color: rgba(74, 222, 128, 0.5);
            box-shadow: 0 0 25px rgba(34, 197, 94, 0.35), 0 20px 50px rgba(0, 0, 0, 0.4) !important;
        }
        body.glow-enabled.glow-pink .card-glass, body.glow-enabled.glow-pink .schedule-day-card {
            border-color: rgba(244, 114, 182, 0.5);
            box-shadow: 0 0 25px rgba(236, 72, 153, 0.35), 0 20px 50px rgba(0, 0, 0, 0.4) !important;
        }
        body.glow-enabled.glow-custom .card-glass, body.glow-enabled.glow-custom .schedule-day-card {
            border-color: var(--custom-glow-border, rgba(59, 130, 246, 0.5));
            box-shadow: 0 0 25px var(--custom-glow-shadow, rgba(59, 130, 246, 0.35)), 0 20px 50px rgba(0, 0, 0, 0.4) !important;
        }

        .schedule-header-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
        }
        .add-subject-btn {
            background: linear-gradient(135deg, #3b82f6, #2563eb);
            color: #fff;
            border: none;
            padding: 12px 20px;
            border-radius: 10px;
            cursor: pointer;
            font-size: 0.95rem;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 8px;
            box-shadow: 0 4px 12px rgba(59, 130, 246, 0.3);
            transition: all 0.2s;
        }
        .add-subject-btn:hover { transform: translateY(-1px); box-shadow: 0 6px 16px rgba(59, 130, 246, 0.4); }

        /* Карточки дней в строчку */
        .schedule-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 20px;
        }
        .schedule-day-card {
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .day-title {
            font-size: 1.1rem;
            font-weight: 600;
            color: #60a5fa;
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
            padding-bottom: 8px;
        }
        .lesson-item {
            background: rgba(15, 23, 42, 0.75);
            border: 1px solid rgba(255, 255, 255, 0.05);
            padding: 12px;
            border-radius: 10px;
            display: flex;
            flex-direction: column;
            gap: 4px;
            position: relative;
        }
        .lesson-time { font-size: 0.8rem; color: #94a3b8; }
        .lesson-name { font-size: 0.95rem; color: #fff; font-weight: 500; }
        .lesson-room { font-size: 0.8rem; color: #38bdf8; }
        .lesson-delete-btn {
            position: absolute;
            top: 10px;
            right: 10px;
            background: none;
            border: none;
            color: #64748b;
            cursor: pointer;
            font-size: 0.85rem;
            transition: color 0.2s;
        }
        .lesson-delete-btn:hover { color: #ef4444; }
        .no-lessons { font-size: 0.85rem; color: #64748b; font-style: italic; text-align: center; padding: 10px 0; }

        /* Модальное окно */
        .modal-overlay {
            position: fixed; inset: 0; background: rgba(11, 15, 25, 0.75);
            backdrop-filter: blur(8px); display: none; align-items: center; justify-content: center; z-index: 100; opacity: 0; transition: opacity 0.2s ease;
        }
        .modal-overlay.active { display: flex; opacity: 1; }
        .modal-card {
            background: rgba(15, 23, 42, 0.9); border: 1px solid rgba(255, 255, 255, 0.12);
            padding: 30px; border-radius: 16px; width: 100%; max-width: 450px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6);
        }
        .modal-title { font-size: 1.3rem; color: #fff; margin-bottom: 20px; }
        .modal-field { margin-bottom: 15px; }
        .modal-field label { display: block; font-size: 0.85rem; color: #94a3b8; margin-bottom: 6px; }
        .modal-input, .modal-select {
            width: 100%; background: rgba(15, 23, 42, 0.9); border: 1px solid rgba(255, 255, 255, 0.1);
            color: #fff; padding: 12px; border-radius: 8px; font-size: 0.95rem; outline: none;
        }
        .modal-input:focus, .modal-select:focus { border-color: #60a5fa; }
        .modal-actions { display: flex; gap: 10px; margin-top: 25px; }
        .modal-btn-save { flex: 1; background: #3b82f6; color: #fff; border: none; padding: 12px; border-radius: 8px; font-weight: 600; cursor: pointer; }
        .modal-btn-cancel { flex: 1; background: rgba(255, 255, 255, 0.05); color: #cbd5e1; border: 1px solid rgba(255, 255, 255, 0.1); padding: 12px; border-radius: 8px; font-weight: 600; cursor: pointer; }
    </style>
    <script>
        const savedOpacity = localStorage.getItem('appBgOpacity') ?? '0.85';
        const savedBlur = localStorage.getItem('appBgBlur') || '0';
        const savedFont = localStorage.getItem('appFontStyle') || 'modern';
        const savedGlow = localStorage.getItem('appGlow') === 'true';
        const savedGlowColor = localStorage.getItem('appGlowColor') || 'blue';
        const savedCustomColor = localStorage.getItem('appCustomGlowColor') || '#3b82f6';

        document.documentElement.style.setProperty('--app-opacity', savedOpacity);
        document.documentElement.style.setProperty('--app-blur', savedBlur + 'px');

        if (savedGlowColor === 'custom') {
            let r = parseInt(savedCustomColor.slice(1, 3), 16) || 59;
            let g = parseInt(savedCustomColor.slice(3, 5), 16) || 130;
            let b = parseInt(savedCustomColor.slice(5, 7), 16) || 246;
            document.documentElement.style.setProperty('--custom-glow-border', `rgba(${r}, ${g}, ${b}, 0.5)`);
            document.documentElement.style.setProperty('--custom-glow-shadow', `rgba(${r}, ${g}, ${b}, 0.35)`);
        }
    </script>
</head>
<body>
    <script>
        document.body.classList.add(`font-${savedFont}`);
        if (savedGlow && savedGlowColor !== 'none') {
            document.body.classList.add('glow-enabled', `glow-${savedGlowColor}`);
        }
    </script>

    <div id="bgContainer" style="position: fixed; inset: 0; z-index: -2; overflow: hidden; filter: var(--app-blur);"></div>
    <div id="videoOverlay" style="position: fixed; inset: 0; z-index: -1; background: rgba(11, 15, 25, var(--app-opacity));"></div>

    <header class="site-header">
        <div class="header-container">
            <a href="calendar.html" class="logo">💻 Texnikum work</a>
            <nav class="nav-menu">
                <a href="calendar.html">Календарь и Заметки</a>
                <a href="index.html" class="active">Расписание</a>
                <a href="settings.html">Настройки</a>
            </nav>
        </div>
    </header>

    <main class="site-main">
        <section class="card-glass" style="max-width: 1200px; padding: 28px;">
            <div class="schedule-header-row">
                <div>
                    <h1>Расписание занятий</h1>
                    <p class="subtitle" style="margin: 0;">Технология машиностроения — 2 курс (Вся неделя)</p>
                </div>
                <button class="add-subject-btn" id="openModalBtn">➕ Добавить предмет</button>
            </div>
            
            <div class="schedule-grid" id="scheduleGridContainer"></div>
        </section>
    </main>

    <!-- Модальное окно -->
    <div class="modal-overlay" id="subjectModal">
        <div class="modal-card">
            <h3 class="modal-title">Добавить новую пару</h3>
            <div class="modal-field">
                <label>День недели:</label>
                <select id="modalDay" class="modal-select">
                    <option value="Понедельник">Понедельник</option>
                    <option value="Вторник">Вторник</option>
                    <option value="Среда">Среда</option>
                    <option value="Четверг">Четверг</option>
                    <option value="Пятница">Пятница</option>
                    <option value="Суббота">Суббота</option>
                </select>
            </div>
            <div class="modal-field">
                <label>Время проведения:</label>
                <input type="text" id="modalTime" class="modal-input" placeholder="Напр. 08:30 - 10:00">
            </div>
            <div class="modal-field">
                <label>Название предмета:</label>
                <input type="text" id="modalSubject" class="modal-input" placeholder="Напр. Технология машиностроения">
            </div>
            <div class="modal-field">
                <label>Аудитория:</label>
                <input type="text" id="modalRoom" class="modal-input" placeholder="Напр. Ауд. 204">
            </div>
            <div class="modal-actions">
                <button class="modal-btn-cancel" id="closeModalBtn">Отмена</button>
                <button class="modal-btn-save" id="saveSubjectBtn">Добавить</button>
            </div>
        </div>
    </div>

    <script src="./js/app-background.js"></script>
    <script>
        const defaultSchedule = [
            { day: "Понедельник", time: "08:30 - 10:00", subject: "Технология машиностроения", room: "Ауд. 204" },
            { day: "Вторник", time: "10:15 - 11:45", subject: "Инженерная графика", room: "Ауд. 310" },
            { day: "Среда", time: "08:30 - 10:00", subject: "Сопротивление материалов", room: "Ауд. 105" },
            { day: "Четверг", time: "10:15 - 11:45", subject: "Метрология и стандартизация", room: "Ауд. 412" },
            { day: "Пятница", time: "08:30 - 10:00", subject: "Электротехника", room: "Ауд. 218" },
            { day: "Суббота", time: "10:15 - 11:45", subject: "Физическая культура", room: "Спортзал" }
        ];

        let scheduleData = JSON.parse(localStorage.getItem('userScheduleData')) || defaultSchedule;

        const scheduleGridContainer = document.getElementById('scheduleGridContainer');
        const subjectModal = document.getElementById('subjectModal');
        const openModalBtn = document.getElementById('openModalBtn');
        const closeModalBtn = document.getElementById('closeModalBtn');
        const saveSubjectBtn = document.getElementById('saveSubjectBtn');

        const modalDay = document.getElementById('modalDay');
        const modalTime = document.getElementById('modalTime');
        const modalSubject = document.getElementById('modalSubject');
        const modalRoom = document.getElementById('modalRoom');

        openModalBtn.addEventListener('click', () => subjectModal.classList.add('active'));
        closeModalBtn.addEventListener('click', () => subjectModal.classList.remove('active'));
        subjectModal.addEventListener('click', (e) => { if (e.target === subjectModal) subjectModal.classList.remove('active'); });

        const daysOfWeek = ["Понедельник", "Вторник", "Среда", "Четверг", "Пятница", "Суббота"];

        function renderSchedule() {
            scheduleGridContainer.innerHTML = '';
            daysOfWeek.forEach(dayName => {
                const card = document.createElement('div');
                card.className = 'schedule-day-card';
                card.innerHTML = `<div class="day-title">${dayName}</div>`;

                const dayLessons = scheduleData.filter(item => item.day === dayName);
                if (dayLessons.length === 0) {
                    const emptyEl = document.createElement('div');
                    emptyEl.className = 'no-lessons';
                    emptyEl.textContent = 'Нет пар';
                    card.appendChild(emptyEl);
                } else {
                    dayLessons.forEach((lesson) => {
                        const globalIndex = scheduleData.indexOf(lesson);
                        const lessonEl = document.createElement('div');
                        lessonEl.className = 'lesson-item';
                        lessonEl.innerHTML = `
                            <span class="lesson-time">⏰ ${lesson.time}</span>
                            <span class="lesson-name">${lesson.subject}</span>
                            <span class="lesson-room">📍 ${lesson.room}</span>
                            <button class="lesson-delete-btn" onclick="deleteSubject(${globalIndex})" title="Удалить">✕</button>
                        `;
                        card.appendChild(lessonEl);
                    });
                }
                scheduleGridContainer.appendChild(card);
            });
        }

        window.deleteSubject = function(index) {
            scheduleData.splice(index, 1);
            localStorage.setItem('userScheduleData', JSON.stringify(scheduleData));
            renderSchedule();
        }

        saveSubjectBtn.addEventListener('click', () => {
            const day = modalDay.value;
            const time = modalTime.value.trim();
            const subject = modalSubject.value.trim();
            const room = modalRoom.value.trim();

            if (!time || !subject) {
                alert('Укажите время и название предмета!');
                return;
            }

            scheduleData.push({ day, time, subject, room: room || 'Не указана' });
            localStorage.setItem('userScheduleData', JSON.stringify(scheduleData));
            renderSchedule();
            subjectModal.classList.remove('active');

            modalTime.value = '';
            modalSubject.value = '';
            modalRoom.value = '';
        });

        renderSchedule();
    </script>
</body>
</html>
