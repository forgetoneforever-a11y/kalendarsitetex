<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Календарь и Расписание</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: #0f1117;
            color: #e2e8f0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .dashboard-container {
            display: flex;
            gap: 30px;
            width: 100%;
            max-width: 1300px;
            background-color: #161b22;
            border: 1px solid #30363d;
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        }

        .sidebar-panel {
            flex: 0 0 280px;
            background-color: #1a212d;
            border: 1px solid #30363d;
            border-radius: 16px;
            padding: 24px;
            display: flex;
            flex-direction: column;
            gap: 16px;
            height: fit-content;
        }

        .nav-button {
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 16px 20px;
            background-color: transparent;
            border: none;
            border-radius: 12px;
            color: #94a3b8;
            font-size: 16px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s ease;
            text-align: left;
            width: 100%;
        }

        .nav-button:hover {
            background-color: rgba(99, 102, 241, 0.1);
            color: #cbd5e1;
        }

        .nav-button.active {
            background-color: #6366f1;
            color: #ffffff;
            box-shadow: 0 4px 12px rgba(99, 102, 241, 0.3);
        }

        .nav-button svg {
            width: 20px;
            height: 20px;
            fill: currentColor;
        }

        .content-panel {
            flex: 1;
            background-color: #1a212d;
            border: 1px solid #30363d;
            border-radius: 16px;
            padding: 36px;
            display: none;
            height: 600px;
            overflow-y: auto;
            flex-direction: column;
        }

        .content-panel.active {
            display: flex;
        }

        .calendar-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
        }

        .calendar-header h2 {
            font-size: 24px;
            font-weight: 600;
            color: #f8fafc;
        }

        .calendar-nav-btn {
            background-color: #21262d;
            border: 1px solid #30363d;
            color: #e2e8f0;
            width: 40px;
            height: 40px;
            border-radius: 12px;
            font-size: 18px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.2s;
        }

        .calendar-nav-btn:hover {
            background-color: #30363d;
        }

        .calendar-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 10px;
            flex: 1;
        }

        .week-day {
            text-align: center;
            font-size: 14px;
            font-weight: 600;
            color: #64748b;
            padding-bottom: 6px;
        }

        .calendar-day {
            background-color: #161b22;
            border: 1px solid #30363d;
            border-radius: 12px;
            display: flex;
            flex-direction: column;
            padding: 8px;
            font-size: 14px;
            font-weight: 500;
            color: #cbd5e1;
            cursor: pointer;
            transition: all 0.2s ease;
            position: relative;
            overflow: hidden;
            gap: 4px;
            min-height: 80px;
        }

        .calendar-day:hover {
            border-color: #6366f1;
            background-color: rgba(99, 102, 241, 0.05);
        }

        .calendar-day.active {
            border-color: #6366f1;
            box-shadow: 0 0 0 1px #6366f1;
        }

        .calendar-day.muted {
            color: #475569;
        }

        .day-number {
            font-weight: 600;
        }

        .day-note-preview {
            font-size: 11px;
            padding: 3px 6px;
            border-radius: 6px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            margin-top: auto;
            font-weight: 500;
        }

        /* Priority Colors */
        .priority-low { background: rgba(59, 130, 246, 0.15); color: #60a5fa; border: 1px solid rgba(59, 130, 246, 0.3); }
        .priority-medium { background: rgba(234, 179, 8, 0.15); color: #facc15; border: 1px solid rgba(234, 179, 8, 0.3); }
        .priority-high { background: rgba(239, 68, 68, 0.15); color: #f87171; border: 1px solid rgba(239, 68, 68, 0.3); }

        /* Modal for editing notes */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.7);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 100;
        }

        .modal {
            background: #1a212d;
            border: 1px solid #30363d;
            padding: 30px;
            border-radius: 16px;
            width: 420px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .modal h3 {
            color: #f8fafc;
            font-size: 20px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .form-group label {
            font-size: 13px;
            color: #94a3b8;
            font-weight: 500;
        }

        .modal input[type="time"],
        .modal textarea {
            width: 100%;
            background: #161b22;
            border: 1px solid #30363d;
            color: #e2e8f0;
            padding: 10px 12px;
            border-radius: 10px;
            font-size: 14px;
        }

        .modal textarea {
            height: 90px;
            resize: none;
        }

        .modal input:focus, .modal textarea:focus {
            outline: none;
            border-color: #6366f1;
        }

        .priority-selector {
            display: flex;
            gap: 10px;
        }

        .priority-btn {
            flex: 1;
            padding: 8px;
            border-radius: 8px;
            border: 1px solid #30363d;
            background: #161b22;
            color: #94a3b8;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }

        .priority-btn.selected-low { background: rgba(59, 130, 246, 0.2); color: #60a5fa; border-color: #3b82f6; }
        .priority-btn.selected-medium { background: rgba(234, 179, 8, 0.2); color: #facc15; border-color: #eab308; }
        .priority-btn.selected-high { background: rgba(239, 68, 68, 0.2); color: #f87171; border-color: #ef4444; }

        .modal-buttons {
            display: flex;
            justify-content: flex-end;
            gap: 12px;
            margin-top: 6px;
        }

        .btn {
            padding: 10px 20px;
            border-radius: 10px;
            font-weight: 600;
            cursor: pointer;
            border: none;
            font-size: 14px;
        }

        .btn-primary {
            background-color: #6366f1;
            color: white;
        }

        .btn-secondary {
            background-color: #21262d;
            color: #cbd5e1;
            border: 1px solid #30363d;
        }

        /* Schedule Panel Styles */
        .schedule-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
        }

        .schedule-header h3 {
            font-size: 24px;
            color: #f8fafc;
        }

        .schedule-list {
            display: flex;
            flex-direction: column;
            gap: 14px;
            overflow-y: auto;
            flex: 1;
        }

        .schedule-item {
            background-color: #161b22;
            border: 1px solid #30363d;
            padding: 16px 20px;
            border-radius: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .schedule-item input {
            background: #1a212d;
            border: 1px solid #30363d;
            color: #e2e8f0;
            padding: 8px 12px;
            border-radius: 8px;
            font-size: 15px;
            width: 45%;
        }

        .schedule-item input:focus {
            outline: none;
            border-color: #6366f1;
        }

        .schedule-item .time {
            color: #818cf8;
            font-weight: 600;
            font-size: 14px;
        }
    </style>
</head>
<body>

    <div class="dashboard-container">
        <div class="sidebar-panel">
            <button class="nav-button active" onclick="switchTab('calendar', this)">
                <svg viewBox="0 0 24 24"><path d="M19 4h-1V2h-2v2H8V2H6v2H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 16H5V10h14v10zm0-12H5V6h14v2z"/></svg>
                Календарь
            </button>
            <button class="nav-button" onclick="switchTab('schedule', this)">
                <svg viewBox="0 0 24 24"><path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-5 14H7v-2h7v2zm3-4H7v-2h10v2zm0-4H7V7h10v2z"/></svg>
                Расписание
            </button>
        </div>

        <div id="calendar-panel" class="content-panel active">
            <div class="calendar-header">
                <!-- Добавлены ID для кнопок навигации -->
                <button class="calendar-nav-btn" id="prev-month">&#10094;</button>
                <h2 id="calendar-month-year">Сентябрь 2026</h2>
                <button class="calendar-nav-btn" id="next-month">&#10095;</button>
            </div>

            <div class="calendar-grid" id="calendar-grid">
                <div class="week-day">Пн</div>
                <div class="week-day">Вт</div>
                <div class="week-day">Ср</div>
                <div class="week-day">Чт</div>
                <div class="week-day">Пт</div>
                <div class="week-day">Сб</div>
                <div class="week-day">Вс</div>
            </div>
        </div>

        <div id="schedule-panel" class="content-panel">
            <div class="schedule-header">
                <h3>Редактирование расписания</h3>
                <button class="btn btn-primary" onclick="saveSchedule()">Сохранить</button>
            </div>
            <div class="schedule-list" id="schedule-list"></div>
        </div>
    </div>

    <!-- Note Modal -->
    <div class="modal-overlay" id="note-modal">
        <div class="modal">
            <h3 id="modal-title">Заметка на день</h3>
            <div class="form-group">
                <label>Время</label>
                <input type="time" id="modal-time" />
            </div>
            <div class="form-group">
                <label>Важность (цвет)</label>
                <div class="priority-selector">
                    <button type="button" class="priority-btn" onclick="setPriority('low', this)">Низкая</button>
                    <button type="button" class="priority-btn" onclick="setPriority('medium', this)">Средняя</button>
                    <button type="button" class="priority-btn" onclick="setPriority('high', this)">Высокая</button>
                </div>
            </div>
            <div class="form-group">
                <label>Текст заметки</label>
                <textarea id="modal-textarea" placeholder="Введите текст заметки..."></textarea>
            </div>
            <div class="modal-buttons">
                <button class="btn btn-secondary" onclick="closeModal()">Отмена</button>
                <button class="btn btn-primary" onclick="saveNote()">Сохранить</button>
            </div>
        </div>
    </div>

    <script>
        let notes = JSON.parse(localStorage.getItem('calendar_notes') || '{}');
        let schedule = JSON.parse(localStorage.getItem('college_schedule') || JSON.stringify([
            { time: "09:00 - 10:30", subject: "Техническая механика" },
            { time: "10:45 - 12:15", subject: "Детали машин" },
            { time: "13:00 - 14:30", subject: "Материаловедение" },
            { time: "14:45 - 16:15", subject: "Инженерная графика" }
        ]));

        let selectedDayKey = null;
        let selectedPriority = 'low';

        // Инициализация текущей даты (сентябрь 2026 по умолчанию или реальное время)
        let currentDate = new Date(2026, 8, 12); 

        const grid = document.getElementById('calendar-grid');
        const monthYearDisplay = document.getElementById('calendar-month-year');
        const monthNames = ["Январь", "Февраль", "Март", "Апрель", "Май", "Июнь", "Июль", "Август", "Сентябрь", "Октябрь", "Ноябрь", "Декабрь"];

        function renderCalendar() {
            // Удаляем старые дни из сетки (оставляя заголовки недели)
            const oldDays = grid.querySelectorAll('.calendar-day');
            oldDays.forEach(el => el.remove());

            const year = currentDate.getFullYear();
            const month = currentDate.getMonth();

            monthYearDisplay.textContent = `${monthNames[month]} ${year}`;

            // Первый день месяца и общее количество дней
            const firstDayIndex = (new Date(year, month, 1).getDay() + 6) % 7; // Пн = 0
            const totalDays = new Date(year, month + 1, 0).getDate();
            const prevTotalDays = new Date(year, month, 0).getDate();

            // Дни предыдущего месяца для заполнения пустых ячеек в начале
            for (let i = firstDayIndex - 1; i >= 0; i--) {
                const dayNum = prevTotalDays - i;
                const prevMonth = month === 0 ? 11 : month - 1;
                const prevYear = month === 0 ? year - 1 : year;
                createDayElement(dayNum, prevYear, prevMonth, true);
            }

            // Дни текущего месяца
            const todayStr = new Date().toISOString().split('T')[0];
            for (let i = 1; i <= totalDays; i++) {
                createDayElement(i, year, month, false);
            }

            // Дни следующего месяца для заполнения хвоста сетки (чтобы было ровно 35 или 42 ячейки)
            const totalCellsDisplayed = firstDayIndex + totalDays;
            const nextDaysCount = totalCellsDisplayed <= 35 ? 35 - totalCellsDisplayed : 42 - totalCellsDisplayed;
            for (let i = 1; i <= nextDaysCount; i++) {
                const nextMonth = month === 11 ? 0 : month + 1;
                const nextYear = month === 11 ? year + 1 : year;
                createDayElement(i, nextYear, nextMonth, true);
            }
        }

        function createDayElement(dayNum, year, month, isMuted) {
            const el = document.createElement('div');
            el.className = 'calendar-day';
            if (isMuted) el.classList.add('muted');

            const monthFormatted = String(month + 1).padStart(2, '0');
            const dayFormatted = String(dayNum).padStart(2, '0');
            const key = `${year}-${monthFormatted}-${dayFormatted}`;

            const todayKey = new Date().toISOString().split('T')[0];
            if (key === todayKey) {
                el.classList.add('active');
            }

            const numEl = document.createElement('div');
            numEl.className = 'day-number';
            numEl.textContent = dayNum;
            el.appendChild(numEl);

            if (notes[key]) {
                const noteData = notes[key];
                const notePrev = document.createElement('div');
                notePrev.className = `day-note-preview priority-${noteData.priority || 'low'}`;
                
                let content = '';
                if (noteData.time) content += `[${noteData.time}] `;
                content += noteData.text;
                notePrev.textContent = content;
                el.appendChild(notePrev);
            }

            el.addEventListener('click', () => {
                openModal(key, dayNum, monthNames[month]);
            });

            grid.appendChild(el);
        }

        function openModal(key, dayNum, monthName) {
            selectedDayKey = key;
            document.getElementById('modal-title').textContent = `Заметка на ${dayNum} ${monthName}`;
            
            const existing = notes[key] || { text: '', time: '', priority: 'low' };
            document.getElementById('modal-textarea').value = existing.text || '';
            document.getElementById('modal-time').value = existing.time || '';
            
            setPriority(existing.priority || 'low');
            document.getElementById('note-modal').style.display = 'flex';
        }

        function setPriority(priority, btnElement) {
            selectedPriority = priority;
            document.querySelectorAll('.priority-btn').forEach(btn => {
                btn.className = 'priority-btn';
            });
            if (!btnElement) {
                const idx = priority === 'low' ? 0 : priority === 'medium' ? 1 : 2;
                btnElement = document.querySelectorAll('.priority-btn')[idx];
            }
            if (btnElement) {
                btnElement.classList.add(`selected-${priority}`);
            }
        }

        function closeModal() {
            document.getElementById('note-modal').style.display = 'none';
        }

        function saveNote() {
            const text = document.getElementById('modal-textarea').value.trim();
            const time = document.getElementById('modal-time').value;
            
            if (text || time) {
                notes[selectedDayKey] = { text, time, priority: selectedPriority };
            } else {
                delete notes[selectedDayKey];
            }
            localStorage.setItem('calendar_notes', JSON.stringify(notes));
            closeModal();
            renderCalendar();
        }

        function renderSchedule() {
            const listEl = document.getElementById('schedule-list');
            listEl.innerHTML = '';
            schedule.forEach((item, index) => {
                const row = document.createElement('div');
                row.className = 'schedule-item';
                row.innerHTML = `
                    <span class="time">${item.time}</span>
                    <input type="text" value="${item.subject}" data-index="${index}" />
                `;
                listEl.appendChild(row);
            });
        }

        function saveSchedule() {
            const inputs = document.querySelectorAll('#schedule-list input');
            inputs.forEach(input => {
                const idx = input.getAttribute('data-index');
                schedule[idx].subject = input.value;
            });
            localStorage.setItem('college_schedule', JSON.stringify(schedule));
            alert('Расписание успешно сохранено!');
        }

        function switchTab(tabName, btnElement) {
            document.querySelectorAll('.content-panel').forEach(p => p.classList.remove('active'));
            document.querySelectorAll('.nav-button').forEach(b => b.classList.remove('active'));

            if (tabName === 'calendar') {
                document.getElementById('calendar-panel').classList.add('active');
            } else if (tabName === 'schedule') {
                document.getElementById('schedule-panel').classList.add('active');
            }

            btnElement.classList.add('active');
        }

        // Обработчики кликов на стрелки переключения месяцев
        document.getElementById('prev-month').addEventListener('click', () => {
            currentDate.setMonth(currentDate.getMonth() - 1);
            renderCalendar();
        });

        document.getElementById('next-month').addEventListener('click', () => {
            currentDate.setMonth(currentDate.getMonth() + 1);
            renderCalendar();
        });

        renderCalendar();
        renderSchedule();
    </script>
</body>
</html>
