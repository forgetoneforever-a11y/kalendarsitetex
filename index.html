<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Календарь и Расписание ДЗ</title>
    <style>
        :root {
            --bg-color: #0b0f19;
            --card-bg: #111827;
            --text-color: #f3f4f6;
            --accent-color: #6366f1;
            --accent-hover: #4f46e5;
            --border-color: #1f2937;
            
            --priority-high: #ef4444;
            --priority-medium: #f59e0b;
            --priority-low: #10b981;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
            box-sizing: border-box;
        }

        .app-layout {
            display: flex;
            gap: 20px;
            width: 100%;
            max-width: 760px;
            align-items: flex-start;
        }

        /* Левая панель навигации */
        .sidebar {
            background-color: var(--card-bg);
            border-radius: 20px;
            padding: 16px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
            border: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            gap: 10px;
            width: 180px;
            box-sizing: border-box;
        }

        .nav-tab-btn {
            background: transparent;
            border: none;
            color: #9ca3af;
            padding: 12px 16px;
            border-radius: 12px;
            cursor: pointer;
            font-size: 0.95rem;
            font-weight: 600;
            text-align: left;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .nav-tab-btn:hover {
            background-color: var(--border-color);
            color: var(--text-color);
        }

        .nav-tab-btn.active {
            background-color: var(--accent-color);
            color: white;
        }

        /* Контейнер для экранов (Календарь / Расписание) */
        .content-area {
            flex: 1;
            background-color: var(--card-bg);
            border-radius: 20px;
            padding: 24px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
            border: 1px solid var(--border-color);
            box-sizing: border-box;
            display: none;
        }

        .content-area.active {
            display: block;
        }

        /* Календарь стили */
        .calendar-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .calendar-header h2 {
            margin: 0;
            font-size: 1.25rem;
        }

        .nav-btn {
            background: var(--border-color);
            border: none;
            color: var(--text-color);
            font-size: 1rem;
            cursor: pointer;
            padding: 8px 12px;
            border-radius: 10px;
            transition: background 0.2s;
        }

        .nav-btn:hover { background-color: var(--accent-color); }

        .weekdays {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            text-align: center;
            font-weight: 600;
            font-size: 0.85rem;
            color: #9ca3af;
            margin-bottom: 10px;
        }

        .days-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 8px;
        }

        .day-cell {
            aspect-ratio: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: rgba(255, 255, 255, 0.02);
            border-radius: 10px;
            cursor: pointer;
            font-size: 0.95rem;
            border: 1px solid var(--border-color);
            transition: all 0.2s;
        }

        .day-cell:hover {
            border-color: var(--accent-color);
            background-color: var(--border-color);
        }

        .day-cell.today {
            border-color: var(--accent-color);
            background-color: rgba(99, 102, 241, 0.15);
            font-weight: bold;
        }

        .day-cell.empty { pointer-events: none; border: none; background: none; }

        /* Панель расписания и ДЗ */
        .schedule-container h3 {
            margin-top: 0;
            font-size: 1.2rem;
            margin-bottom: 14px;
            color: var(--text-color);
        }

        .schedule-tabs {
            display: flex;
            gap: 6px;
            overflow-x: auto;
            margin-bottom: 16px;
            padding-bottom: 4px;
        }

        .tab-btn {
            background: var(--bg-color);
            border: 1px solid var(--border-color);
            color: #9ca3af;
            padding: 6px 12px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.85rem;
            white-space: nowrap;
            transition: all 0.2s;
        }

        .tab-btn.active {
            background-color: var(--accent-color);
            color: white;
            border-color: var(--accent-color);
        }

        .schedule-card {
            background-color: var(--bg-color);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 16px;
            font-size: 0.95rem;
        }

        .schedule-card p {
            margin: 8px 0;
            line-height: 1.4;
        }

        .schedule-card strong {
            color: var(--accent-color);
        }

        /* Модальное окно */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(6px);
            justify-content: center;
            align-items: center;
            padding: 16px;
            box-sizing: border-box;
        }

        .modal.active { display: flex; }

        .modal-content {
            background-color: var(--card-bg);
            padding: 24px;
            border-radius: 16px;
            width: 100%;
            max-width: 400px;
            border: 1px solid var(--border-color);
            box-shadow: 0 15px 35px rgba(0,0,0,0.6);
            box-sizing: border-box;
            max-height: 90vh;
            overflow-y: auto;
        }

        .form-group {
            margin-bottom: 14px;
        }

        .form-group label {
            display: block;
            font-size: 0.85rem;
            color: #9ca3af;
            margin-bottom: 6px;
        }

        .form-group input, .form-group textarea {
            width: 100%;
            padding: 10px;
            border-radius: 10px;
            border: 1px solid var(--border-color);
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: inherit;
            box-sizing: border-box;
            font-size: 0.95rem;
        }

        .form-group textarea { resize: vertical; height: 80px; }

        .priority-selector {
            display: flex;
            gap: 8px;
        }

        .priority-option {
            flex: 1;
            padding: 8px;
            text-align: center;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.8rem;
            font-weight: 600;
            border: 1px solid var(--border-color);
        }

        .priority-option.high { color: var(--priority-high); }
        .priority-option.medium { color: var(--priority-medium); }
        .priority-option.low { color: var(--priority-low); }

        .priority-option.selected.high { background-color: var(--priority-high); color: white; }
        .priority-option.selected.medium { background-color: var(--priority-medium); color: white; }
        .priority-option.selected.low { background-color: var(--priority-low); color: white; }

        .modal-actions {
            display: flex;
            justify-content: flex-end;
            gap: 10px;
            margin-top: 18px;
        }

        .btn {
            padding: 10px 16px;
            border-radius: 10px;
            border: none;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.9rem;
        }

        .btn-cancel { background-color: transparent; color: #9ca3af; }
        .btn-submit { background-color: var(--accent-color); color: white; }

        /* Мобильная адаптация: если экран узкий (телефоны), панель уходит наверх */
        @media (max-width: 650px) {
            .app-layout {
                flex-direction: column;
                max-width: 480px;
            }
            .sidebar {
                width: 100%;
                flex-direction: row;
                justify-content: space-around;
                padding: 10px;
            }
            .nav-tab-btn {
                padding: 8px 12px;
                font-size: 0.9rem;
                justify-content: center;
            }
        }
    </style>
</head>
<body>

    <div class="app-layout">
        <!-- Левая панель навигации -->
        <div class="sidebar">
            <button class="nav-tab-btn active" data-target="calendar-tab">📅 Календарь</button>
            <button class="nav-tab-btn" data-target="schedule-tab">📖 Расписание</button>
        </div>

        <!-- Экран 1: Календарь -->
        <div class="content-area active" id="calendar-tab">
            <div class="calendar-header">
                <button class="nav-btn" id="prev-month">&#10094;</button>
                <h2 id="month-year">Месяц Год</h2>
                <button class="nav-btn" id="next-month">&#10095;</button>
            </div>
            <div class="weekdays">
                <div>Пн</div><div>Вт</div><div>Ср</div><div>Чт</div><div>Пт</div><div>Сб</div><div>Вс</div>
            </div>
            <div class="days-grid" id="days-grid"></div>
        </div>

        <!-- Экран 2: Расписание и ДЗ -->
        <div class="content-area" id="schedule-tab">
            <div class="schedule-container">
                <h3>📖 Расписание и ДЗ</h3>
                <div class="schedule-tabs" id="schedule-tabs">
                    <button class="tab-btn active" data-day="Monday">Пн</button>
                    <button class="tab-btn" data-day="Tuesday">Вт</button>
                    <button class="tab-btn" data-day="Wednesday">Ср</button>
                    <button class="tab-btn" data-day="Thursday">Чт</button>
                    <button class="tab-btn" data-day="Friday">Пт</button>
                </div>
                <div class="schedule-card" id="schedule-card-content"></div>
            </div>
        </div>
    </div>

    <!-- Модальное окно для закладок -->
    <div class="modal" id="bookmark-modal">
        <div class="modal-content">
            <h3 id="modal-date-title" style="margin-top:0; font-size:1.1rem;">Новая закладка</h3>
            
            <div class="form-group">
                <label>Важность:</label>
                <div class="priority-selector">
                    <div class="priority-option high selected" data-value="high">Красный</div>
                    <div class="priority-option medium" data-value="medium">Оранж.</div>
                    <div class="priority-option low" data-value="low">Зеленый</div>
                </div>
            </div>

            <div class="form-group">
                <label for="send-date">Дата отправки боту:</label>
                <input type="date" id="send-date">
            </div>

            <div class="form-group">
                <label for="bookmark-time">Время:</label>
                <input type="time" id="bookmark-time" value="12:00">
            </div>

            <div class="form-group">
                <label for="bookmark-text">Текст:</label>
                <textarea id="bookmark-text" placeholder="Введите текст заметки..."></textarea>
            </div>

            <div class="form-group">
                <label for="file-input">Файл:</label>
                <input type="file" id="file-input">
            </div>

            <div class="modal-actions">
                <button class="btn btn-cancel" id="close-modal">Отмена</button>
                <button class="btn btn-submit" id="save-bookmark">Отправить</button>
            </div>
        </div>
    </div>

    <script>
        const BACKEND_URL = "https://botkalendar.onrender.com";

        // Переключение между вкладками меню (Календарь / Расписание)
        const navButtons = document.querySelectorAll('.nav-tab-btn');
        const contentAreas = document.querySelectorAll('.content-area');

        navButtons.forEach(btn => {
            btn.addEventListener('click', () => {
                navButtons.forEach(b => b.classList.remove('active'));
                contentAreas.forEach(c => c.classList.remove('active'));

                btn.classList.add('active');
                const targetId = btn.getAttribute('data-target');
                document.getElementById(targetId).classList.add('active');
            });
        });

        // Данные расписания
        const scheduleData = {
            Monday: { name: "Понедельник", lessons: "Математика, Физика, Программирование", homework: "Сделать практическую работу по Python и выучить формулы." },
            Tuesday: { name: "Вторник", lessons: "Инженерная графика, Базы данных", homework: "Доделать чертеж в КОМПАС-3D и подготовить запросы SQL." },
            Wednesday: { name: "Среда", lessons: "Электротехника, История", homework: "Подготовить конспект по лекции и решить задачи." },
            Thursday: { name: "Четверг", lessons: "Веб-разработка, Сети", homework: "Доделать верстку сайта и изучить маршрутизацию." },
            Friday: { name: "Пятница", lessons: "Физкультура, Английский", homework: "Выучить новые технические термины." }
        };

        function renderSchedule(dayKey) {
            const data = scheduleData[dayKey];
            const contentEl = document.getElementById("schedule-card-content");
            if (data) {
                contentEl.innerHTML = `
                    <p><strong>День:</strong> ${data.name}</p>
                    <p><strong>Предметы:</strong> ${data.lessons}</p>
                    <p><strong>Домашка:</strong> ${data.homework}</p>
                `;
            } else {
                contentEl.innerHTML = `<p>Пар нет, отдыхай!</p>`;
            }
        }

        document.querySelectorAll('.tab-btn').forEach(btn => {
            btn.addEventListener('click', (e) => {
                document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
                e.target.classList.add('active');
                renderSchedule(e.target.getAttribute('data-day'));
            });
        });

        renderSchedule("Monday");

        // Логика календаря
        let currentDate = new Date();
        let selectedDateStr = "";
        let selectedPriority = "high";

        const monthNames = ["Январь", "Февраль", "Март", "Апрель", "Май", "Июнь", "Июль", "Август", "Сентябрь", "Октябрь", "Ноябрь", "Декабрь"];

        const monthYearEl = document.getElementById("month-year");
        const daysGridEl = document.getElementById("days-grid");
        const prevMonthBtn = document.getElementById("prev-month");
        const nextMonthBtn = document.getElementById("next-month");
        
        const modal = document.getElementById("bookmark-modal");
        const modalTitle = document.getElementById("modal-date-title");
        const closeModalBtn = document.getElementById("close-modal");
        const saveBookmarkBtn = document.getElementById("save-bookmark");
        
        const sendDateInput = document.getElementById("send-date");
        const timeInput = document.getElementById("bookmark-time");
        const textInput = document.getElementById("bookmark-text");
        const fileInput = document.getElementById("file-input");

        document.querySelectorAll('.priority-option').forEach(option => {
            option.addEventListener('click', () => {
                document.querySelectorAll('.priority-option').forEach(o => o.classList.remove('selected'));
                option.classList.add('selected');
                selectedPriority = option.getAttribute('data-value');
            });
        });

        function renderCalendar() {
            const year = currentDate.getFullYear();
            const month = currentDate.getMonth();

            monthYearEl.textContent = `${monthNames[month]} ${year}`;
            daysGridEl.innerHTML = "";

            let firstDayIndex = new Date(year, month, 1).getDay();
            firstDayIndex = firstDayIndex === 0 ? 6 : firstDayIndex - 1;

            const totalDays = new Date(year, month + 1, 0).getDate();

            for (let i = 0; i < firstDayIndex; i++) {
                const emptyCell = document.createElement("div");
                emptyCell.classList.add("day-cell", "empty");
                daysGridEl.appendChild(emptyCell);
            }

            const today = new Date();
            for (let day = 1; day <= totalDays; day++) {
                const cell = document.createElement("div");
                cell.classList.add("day-cell");
                cell.textContent = day;

                const formattedMonth = String(month + 1).padStart(2, '0');
                const formattedDay = String(day).padStart(2, '0');
                const dateStr = `${year}-${formattedMonth}-${formattedDay}`;

                if (day === today.getDate() && month === today.getMonth() && year === today.getFullYear()) {
                    cell.classList.add("today");
                }

                cell.addEventListener("click", () => {
                    selectedDateStr = dateStr;
                    modalTitle.textContent = `Заметка на ${formattedDay}.${formattedMonth}.${year}`;
                    sendDateInput.value = dateStr;
                    textInput.value = "";
                    fileInput.value = "";
                    modal.classList.add("active");
                });

                daysGridEl.appendChild(cell);
            }
        }

        prevMonthBtn.addEventListener("click", () => { currentDate.setMonth(currentDate.getMonth() - 1); renderCalendar(); });
        nextMonthBtn.addEventListener("click", () => { currentDate.setMonth(currentDate.getMonth() + 1); renderCalendar(); });
        closeModalBtn.addEventListener("click", () => { modal.classList.remove("active"); });

        saveBookmarkBtn.addEventListener("click", async () => {
            const textVal = textInput.value.trim();
            const sendDateVal = sendDateInput.value;
            const timeVal = timeInput.value;

            if (!textVal) { alert("Введите текст закладки!"); return; }

            saveBookmarkBtn.textContent = "Отправка...";
            saveBookmarkBtn.disabled = true;

            const formData = new FormData();
            formData.append("date", selectedDateStr);
            formData.append("time", timeVal);
            formData.append("send_date", sendDateVal);
            formData.append("priority", selectedPriority);
            formData.append("text", textVal);

            if (fileInput.files.length > 0) {
                formData.append("file", fileInput.files[0]);
            }

            try {
                const response = await fetch(`${BACKEND_URL}/api/send-bookmark`, { method: "POST", body: formData });
                const result = await response.json();
                if (response.ok) {
                    alert("Успешно отправлено!");
                    modal.classList.remove("active");
                } else {
                    alert("Ошибка: " + (result.detail || "Не удалось отправить"));
                }
            } catch (error) {
                alert("Ошибка сети.");
            } finally {
                saveBookmarkBtn.textContent = "Отправить";
                saveBookmarkBtn.disabled = false;
            }
        });

        renderCalendar();
    </script>
</body>
</html>
