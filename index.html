<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Расписание — Органайзер</title>
    
    <link rel="stylesheet" href="./css/variables.css">
    <link rel="stylesheet" href="./css/global.css">
    <link rel="stylesheet" href="./css/layout.css">
    <style>
        body.font-modern { font-family: system-ui, -apple-system, sans-serif; }
        body.font-neon { font-family: 'Courier New', Courier, monospace; letter-spacing: 0.5px; }
        body.font-retro { font-family: 'Lucida Console', Monaco, monospace; text-transform: uppercase; font-size: 0.9rem; }

        body.glow-enabled.glow-blue .card-glass {
            border-color: rgba(96, 165, 250, 0.5);
            box-shadow: 0 0 25px rgba(59, 130, 246, 0.35), 0 20px 50px rgba(0, 0, 0, 0.4) !important;
        }
        body.glow-enabled.glow-purple .card-glass {
            border-color: rgba(192, 132, 252, 0.5);
            box-shadow: 0 0 25px rgba(168, 85, 247, 0.35), 0 20px 50px rgba(0, 0, 0, 0.4) !important;
        }
        body.glow-enabled.glow-green .card-glass {
            border-color: rgba(74, 222, 128, 0.5);
            box-shadow: 0 0 25px rgba(34, 197, 94, 0.35), 0 20px 50px rgba(0, 0, 0, 0.4) !important;
        }
        body.glow-enabled.glow-pink .card-glass {
            border-color: rgba(244, 114, 182, 0.5);
            box-shadow: 0 0 25px rgba(236, 72, 153, 0.35), 0 20px 50px rgba(0, 0, 0, 0.4) !important;
        }
        body.glow-enabled.glow-custom .card-glass {
            border-color: var(--custom-glow-border, rgba(59, 130, 246, 0.5));
            box-shadow: 0 0 25px var(--custom-glow-shadow, rgba(59, 130, 246, 0.35)), 0 20px 50px rgba(0, 0, 0, 0.4) !important;
        }
    </style>
    <script>
        const savedOpacity = localStorage.getItem('appBgOpacity') ?? '0.85';
        const savedBlur = localStorage.getItem('appBgBlur') || '0';
        const savedFont = localStorage.getItem('appFontStyle') || 'modern';
        const savedGlow = localStorage.getItem('appGlow') === 'true';
        const savedGlowColor = localStorage.getItem('appGlowColor') || 'blue';
        const savedCustomColor = localStorage.getItem('appCustomGlowColor') || '#3b82f6';

        document.documentElement.style.setProperty('--app-opacity', savedOpacity);
        document.documentElement.style.setProperty('--app-blur', savedBlur + 'px');

        if (savedGlowColor === 'custom') {
            let r = parseInt(savedCustomColor.slice(1, 3), 16) || 59;
            let g = parseInt(savedCustomColor.slice(3, 5), 16) || 130;
            let b = parseInt(savedCustomColor.slice(5, 7), 16) || 246;
            document.documentElement.style.setProperty('--custom-glow-border', `rgba(${r}, ${g}, ${b}, 0.5)`);
            document.documentElement.style.setProperty('--custom-glow-shadow', `rgba(${r}, ${g}, ${b}, 0.35)`);
        }
    </script>
</head>
<body>
    <script>
        document.body.classList.add(`font-${savedFont}`);
        if (savedGlow && savedGlowColor !== 'none') {
            document.body.classList.add('glow-enabled', `glow-${savedGlowColor}`);
        }
    </script>

    <div id="bgContainer" style="position: fixed; inset: 0; z-index: -2; overflow: hidden; filter: var(--app-blur);"></div>
    <div id="videoOverlay" style="position: fixed; inset: 0; z-index: -1; background: rgba(11, 15, 25, var(--app-opacity));"></div>

    <header class="site-header">
        <div class="header-container">
            <a href="calendar.html" class="logo">📅 Органайзер</a>
            <nav class="nav-menu">
                <a href="calendar.html">Календарь и Заметки</a>
                <a href="index.html" class="active">Расписание</a>
                <a href="settings.html">Настройки</a>
            </nav>
        </div>
    </header>

    <main class="site-main">
        <section class="card-glass">
            <h1>Расписание занятий</h1>
            <p class="subtitle">Технология машиностроения — 2 курс</p>
            
            <div class="table-responsive">
                <table class="shedule-table">
                    <thead>
                        <tr>
                            <th>День</th>
                            <th>Время</th>
                            <th>Предмет</th>
                            <th>Аудитория</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr>
                            <td>Понедельник</td>
                            <td>08:30 - 10:00</td>
                            <td>Технология машиностроения</td>
                            <td>Ауд. 204</td>
                        </tr>
                        <tr>
                            <td>Вторник</td>
                            <td>10:15 - 11:45</td>
                            <td>Инженерная графика</td>
                            <td>Ауд. 310</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </section>
    </main>

    <script src="./js/app-background.js"></script>
</body>
</html>
