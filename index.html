<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Расписание — Органайзер</title>
    
    <link rel="stylesheet" href="./css/variables.css">
    <link rel="stylesheet" href="./css/global.css">
    <link rel="stylesheet" href="./css/layout.css">
    <style>
        body.font-modern { font-family: system-ui, -apple-system, sans-serif; }
        body.font-neon { font-family: 'Courier New', Courier, monospace; letter-spacing: 0.5px; }
        body.font-retro { font-family: 'Lucida Console', Monaco, monospace; text-transform: uppercase; font-size: 0.9rem; }

        body.glow-enabled.glow-blue .card-glass {
            border-color: rgba(96, 165, 250, 0.5);
            box-shadow: 0 0 25px rgba(59, 130, 246, 0.35), 0 20px 50px rgba(0, 0, 0, 0.4) !important;
        }
        body.glow-enabled.glow-purple .card-glass {
            border-color: rgba(192, 132, 252, 0.5);
            box-shadow: 0 0 25px rgba(168, 85, 247, 0.35), 0 20px 50px rgba(0, 0, 0, 0.4) !important;
        }
        body.glow-enabled.glow-green .card-glass {
            border-color: rgba(74, 222, 128, 0.5);
            box-shadow: 0 0 25px rgba(34, 197, 94, 0.35), 0 20px 50px rgba(0, 0, 0, 0.4) !important;
        }
        body.glow-enabled.glow-pink .card-glass {
            border-color: rgba(244, 114, 182, 0.5);
            box-shadow: 0 0 25px rgba(236, 72, 153, 0.35), 0 20px 50px rgba(0, 0, 0, 0.4) !important;
        }
        body.glow-enabled.glow-custom .card-glass {
            border-color: var(--custom-glow-border, rgba(59, 130, 246, 0.5));
            box-shadow: 0 0 25px var(--custom-glow-shadow, rgba(59, 130, 246, 0.35)), 0 20px 50px rgba(0, 0, 0, 0.4) !important;
        }

        .schedule-header-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
        }
        .add-subject-btn {
            background: linear-gradient(135deg, #3b82f6, #2563eb);
            color: #fff;
            border: none;
            padding: 12px 20px;
            border-radius: 10px;
            cursor: pointer;
            font-size: 0.95rem;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 8px;
            box-shadow: 0 4px 12px rgba(59, 130, 246, 0.3);
            transition: all 0.2s;
        }
        .add-subject-btn:hover {
            transform: translateY(-1px);
            box-shadow: 0 6px 16px rgba(59, 130, 246, 0.4);
        }

        /* Модальное окно */
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(11, 15, 25, 0.75);
            backdrop-filter: blur(8px);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 100;
            opacity: 0;
            transition: opacity 0.2s ease;
        }
        .modal-overlay.active {
            display: flex;
            opacity: 1;
        }
        .modal-card {
            background: rgba(15, 23, 42, 0.85);
            border: 1px solid rgba(255, 255, 255, 0.12);
            padding: 30px;
            border-radius: 16px;
            width: 100%;
            max-width: 450px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6);
            transform: scale(0.95);
            transition: transform 0.2s ease;
        }
        .modal-overlay.active .modal-card {
            transform: scale(1);
        }
        .modal-title {
            font-size: 1.3rem;
            color: #fff;
            margin-bottom: 20px;
        }
        .modal-field {
            margin-bottom: 15px;
        }
        .modal-field label {
            display: block;
            font-size: 0.85rem;
            color: #94a3b8;
            margin-bottom: 6px;
        }
        .modal-input, .modal-select {
            width: 100%;
            background: rgba(15, 23, 42, 0.9);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: #fff;
            padding: 12px;
            border-radius: 8px;
            font-size: 0.95rem;
            outline: none;
        }
        .modal-input:focus, .modal-select:focus {
            border-color: #60a5fa;
        }
        .modal-actions {
            display: flex;
            gap: 10px;
            margin-top: 25px;
        }
        .modal-btn-save {
            flex: 1;
            background: #3b82f6;
            color: #fff;
            border: none;
            padding: 12px;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
        }
        .modal-btn-cancel {
            flex: 1;
            background: rgba(255, 255, 255, 0.05);
            color: #cbd5e1;
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 12px;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
        }

        .delete-btn {
            background: rgba(239, 68, 68, 0.15);
            color: #fca5a5;
            border: none;
            padding: 6px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.8rem;
            transition: background 0.2s;
        }
        .delete-btn:hover {
            background: rgba(239, 68, 68, 0.3);
        }
    </style>
    <script>
        const savedOpacity = localStorage.getItem('appBgOpacity') ?? '0.85';
        const savedBlur = localStorage.getItem('appBgBlur') || '0';
        const savedFont = localStorage.getItem('appFontStyle') || 'modern';
        const savedGlow = localStorage.getItem('appGlow'] === 'true';
        const savedGlowColor = localStorage.getItem('appGlowColor') || 'blue';
        const savedCustomColor = localStorage.getItem('appCustomGlowColor') || '#3b82f6';

        document.documentElement.style.setProperty('--app-opacity', savedOpacity);
        document.documentElement.style.setProperty('--app-blur', savedBlur + 'px');

        if (savedGlowColor === 'custom') {
            let r = parseInt(savedCustomColor.slice(1, 3), 16) || 59;
            let g = parseInt(savedCustomColor.slice(3, 5), 16) || 130;
            let b = parseInt(savedCustomColor.slice(5, 7), 16) || 246;
            document.documentElement.style.setProperty('--custom-glow-border', `rgba(${r}, ${g}, ${b}, 0.5)`);
            document.documentElement.style.setProperty('--custom-glow-shadow', `rgba(${r}, ${g}, ${b}, 0.35)`);
        }
    </script>
</head>
<body>
    <script>
        document.body.classList.add(`font-${savedFont}`);
        if (savedGlow && savedGlowColor !== 'none') {
            document.body.classList.add('glow-enabled', `glow-${savedGlowColor}`);
        }
    </script>

    <div id="bgContainer" style="position: fixed; inset: 0; z-index: -2; overflow: hidden; filter: var(--app-blur);"></div>
    <div id="videoOverlay" style="position: fixed; inset: 0; z-index: -1; background: rgba(11, 15, 25, var(--app-opacity));"></div>

    <header class="site-header">
        <div class="header-container">
            <a href="calendar.html" class="logo">📅 Органайзер</a>
            <nav class="nav-menu">
                <a href="calendar.html">Календарь и Заметки</a>
                <a href="index.html" class="active">Расписание</a>
                <a href="settings.html">Настройки</a>
            </nav>
        </div>
    </header>

    <main class="site-main">
        <section class="card-glass" style="max-width: 950px;">
            <div class="schedule-header-row">
                <div>
                    <h1>Расписание занятий</h1>
                    <p class="subtitle" style="margin: 0;">Технология машиностроения — 2 курс (Вся неделя)</p>
                </div>
                <button class="add-subject-btn" id="openModalBtn">➕ Добавить предмет</button>
            </div>
            
            <div class="table-responsive">
                <table class="shedule-table" style="width: 100%; border-collapse: collapse;">
                    <thead>
                        <tr style="border-bottom: 1px solid rgba(255,255,255,0.1); text-align: left;">
                            <th style="padding: 12px; color: #94a3b8;">ДЕНЬ</th>
                            <th style="padding: 12px; color: #94a3b8;">ВРЕМЯ</th>
                            <th style="padding: 12px; color: #94a3b8;">ПРЕДМЕТ</th>
                            <th style="padding: 12px; color: #94a3b8;">АУДИТОРИЯ</th>
                            <th style="padding: 12px; color: #94a3b8; text-align: right;">ДЕЙСТВИЕ</th>
                        </tr>
                    </thead>
                    <tbody id="scheduleTableBody">
                        <!-- Динамически заполняется -->
                    </tbody>
                </table>
            </div>
        </section>
    </main>

    <!-- Модальное окно добавления предмета -->
    <div class="modal-overlay" id="subjectModal">
        <div class="modal-card">
            <h3 class="modal-title">Добавить новую пару</h3>
            
            <div class="modal-field">
                <label>День недели:</label>
                <select id="modalDay" class="modal-select">
                    <option value="Понедельник">Понедельник</option>
                    <option value="Вторник">Вторник</option>
                    <option value="Среда">Среда</option>
                    <option value="Четверг">Четверг</option>
                    <option value="Пятница">Пятница</option>
                    <option value="Суббота">Суббота</option>
                </select>
            </div>

            <div class="modal-field">
                <label>Время проведения:</label>
                <input type="text" id="modalTime" class="modal-input" placeholder="Напр. 08:30 - 10:00">
            </div>

            <div class="modal-field">
                <label>Название предмета:</label>
                <input type="text" id="modalSubject" class="modal-input" placeholder="Напр. Технология машиностроения">
            </div>

            <div class="modal-field">
                <label>Аудитория:</label>
                <input type="text" id="modalRoom" class="modal-input" placeholder="Напр. Ауд. 204">
            </div>

            <div class="modal-actions">
                <button class="modal-btn-cancel" id="closeModalBtn">Отмена</button>
                <button class="modal-btn-save" id="saveSubjectBtn">Добавить в расписание</button>
            </div>
        </div>
    </div>

    <script src="./js/app-background.js"></script>
    <script>
        const defaultSchedule = [
            { day: "Понедельник", time: "08:30 - 10:00", subject: "Технология машиностроения", room: "Ауд. 204" },
            { day: "Вторник", time: "10:15 - 11:45", subject: "Инженерная графика", room: "Ауд. 310" },
            { day: "Среда", time: "08:30 - 10:00", subject: "Сопротивление материалов", room: "Ауд. 105" },
            { day: "Четверг", time: "10:15 - 11:45", subject: "Метрология и стандартизация", room: "Ауд. 412" },
            { day: "Пятница", time: "08:30 - 10:00", subject: "Электротехника", room: "Ауд. 218" },
            { day: "Суббота", time: "10:15 - 11:45", subject: "Физическая культура", room: "Спортзал" }
        ];

        let scheduleData = JSON.parse(localStorage.getItem('userScheduleData')) || defaultSchedule;

        const scheduleTableBody = document.getElementById('scheduleTableBody');
        const subjectModal = document.getElementById('subjectModal');
        const openModalBtn = document.getElementById('openModalBtn');
        const closeModalBtn = document.getElementById('closeModalBtn');
        const saveSubjectBtn = document.getElementById('saveSubjectBtn');

        const modalDay = document.getElementById('modalDay');
        const modalTime = document.getElementById('modalTime');
        const modalSubject = document.getElementById('modalSubject');
        const modalRoom = document.getElementById('modalRoom');

        openModalBtn.addEventListener('click', () => subjectModal.classList.add('active'));
        closeModalBtn.addEventListener('click', () => subjectModal.classList.remove('active'));
        
        subjectModal.addEventListener('click', (e) => {
            if (e.target === subjectModal) subjectModal.classList.remove('active');
        });

        function renderSchedule() {
            scheduleTableBody.innerHTML = '';
            
            if (scheduleData.length === 0) {
                scheduleTableBody.innerHTML = `<tr><td colspan="5" style="text-align: center; padding: 25px; color: #94a3b8;">Расписание пусто. Нажмите кнопку добавления выше!</td></tr>`;
                return;
            }

            scheduleData.forEach((item, index) => {
                const tr = document.createElement('tr');
                tr.style.borderBottom = "1px solid rgba(255,255,255,0.05)";
                tr.innerHTML = `
                    <td style="padding: 14px 12px; font-weight: 600; color: #60a5fa;">${item.day}</td>
                    <td style="padding: 14px 12px; color: #cbd5e1;">${item.time}</td>
                    <td style="padding: 14px 12px; color: #fff;">${item.subject}</td>
                    <td style="padding: 14px 12px; color: #94a3b8;">${item.room}</td>
                    <td style="padding: 14px 12px; text-align: right;">
                        <button class="delete-btn" onclick="deleteSubject(${index})">Удалить</button>
                    </td>
                `;
                scheduleTableBody.appendChild(tr);
            });
        }

        window.deleteSubject = function(index) {
            scheduleData.splice(index, 1);
            localStorage.setItem('userScheduleData', JSON.stringify(scheduleData));
            renderSchedule();
        }

        saveSubjectBtn.addEventListener('click', () => {
            const day = modalDay.value;
            const time = modalTime.value.trim();
            const subject = modalSubject.value.trim();
            const room = modalRoom.value.trim();

            if (!time || !subject) {
                alert('Пожалуйста, укажите время и название предмета!');
                return;
            }

            scheduleData.push({ day, time, subject, room: room || 'Не указана' });
            localStorage.setItem('userScheduleData', JSON.stringify(scheduleData));
            
            renderSchedule();
            subjectModal.classList.remove('active');

            // Очищаем поля
            modalTime.value = '';
            modalSubject.value = '';
            modalRoom.value = '';
        });

        renderSchedule();
    </script>
</body>
</html>
