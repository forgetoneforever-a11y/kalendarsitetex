<script>
        const BACKEND_URL = "https://botkalendar.onrender.com";

        let currentDate = new Date();
        let selectedDateStr = "";
        let selectedPriority = "high";

        const monthNames = ["Январь", "Февраль", "Март", "Апрель", "Май", "Июнь", "Июль", "Август", "Сентябрь", "Октябрь", "Ноябрь", "Декабрь"];

        const monthYearEl = document.getElementById("month-year");
        const daysGridEl = document.getElementById("days-grid");
        const prevMonthBtn = document.getElementById("prev-month");
        const nextMonthBtn = document.getElementById("next-month");
        
        const modal = document.getElementById("bookmark-modal");
        const modalTitle = document.getElementById("modal-date-title");
        const closeModalBtn = document.getElementById("close-modal");
        const saveBookmarkBtn = document.getElementById("save-bookmark");
        
        const sendDateInput = document.getElementById("send-date");
        const timeInput = document.getElementById("bookmark-time");
        const textInput = document.getElementById("bookmark-text");
        const fileInput = document.getElementById("file-input");

        const bgFileInput = document.getElementById("bg-file-input");
        const bgMedia = document.getElementById("bg-media");
        const bgOverlay = document.getElementById("bg-overlay");
        const overlayRange = document.getElementById("overlay-range");
        const overlayVal = document.getElementById("overlay-val");
        const radiusRange = document.getElementById("radius-range");
        const radiusVal = document.getElementById("radius-val");
        const accentColorPicker = document.getElementById("accent-color-picker");
        const resetSettingsBtn = document.getElementById("reset-settings");

        // --- Жесткое сохранение через Base64 и localStorage (обход сброса IndexedDB) ---
        
        function loadSavedSettings() {
            // Загружаем настройки дизайна
            const savedOverlay = localStorage.getItem("app_overlay");
            if (savedOverlay !== null) {
                overlayRange.value = savedOverlay;
                overlayVal.textContent = savedOverlay;
                bgOverlay.style.backgroundColor = `rgba(0, 0, 0, ${savedOverlay})`;
            }

            const savedRadius = localStorage.getItem("app_radius");
            if (savedRadius !== null) {
                radiusRange.value = savedRadius;
                radiusVal.textContent = savedRadius;
                document.documentElement.style.setProperty('--border-radius', `${savedRadius}px`);
            }

            const savedAccent = localStorage.getItem("app_accent");
            if (savedAccent !== null) {
                accentColorPicker.value = savedAccent;
                document.documentElement.style.setProperty('--accent-color', savedAccent);
            }

            // Загружаем фоновое видео/картинку из localStorage
            const savedBgType = localStorage.getItem("app_bg_type");
            const savedBgData = localStorage.getItem("app_bg_data");

            if (savedBgType && savedBgData) {
                applyBackground(savedBgType, savedBgData);
            }
        }

        function applyBackground(type, url) {
            if (type.startsWith("video/")) {
                bgMedia.style.display = "block";
                document.body.style.backgroundImage = "none";
                bgMedia.src = url;
                bgMedia.load();
                bgMedia.play().catch(err => console.log("Автозапуск:", err));
            } else if (type.startsWith("image/")) {
                bgMedia.style.display = "none";
                bgMedia.src = "";
                document.body.style.backgroundImage = `url('${url}')`;
            }
        }

        // Конвертируем файл в Base64, чтобы он не удалялся браузером
        bgFileInput.addEventListener("change", (e) => {
            const file = e.target.files[0];
            if (!file) return;

            // Просим браузер запросить постоянное хранилище (чтобы он не чистил файл сам)
            if (navigator.storage && navigator.storage.persist) {
                navigator.storage.persist().then(granted => {
                    console.log("Постоянное хранилище:", granted);
                });
            }

            const reader = new FileReader();
            reader.onload = function(event) {
                const base64Data = event.target.result;
                
                // Сохраняем в постоянный localStorage
                localStorage.setItem("app_bg_type", file.type);
                localStorage.setItem("app_bg_data", base64Data);

                applyBackground(file.type, base64Data);
            };
            reader.readAsDataURL(file);
        });

        document.querySelectorAll('.priority-option').forEach(option => {
            option.addEventListener('click', () => {
                document.querySelectorAll('.priority-option').forEach(o => o.classList.remove('selected'));
                option.classList.add('selected');
                selectedPriority = option.getAttribute('data-value');
            });
        });

        function renderCalendar() {
            const year = currentDate.getFullYear();
            const month = currentDate.getMonth();

            monthYearEl.textContent = `${monthNames[month]} ${year}`;
            daysGridEl.innerHTML = "";

            let firstDayIndex = new Date(year, month, 1).getDay();
            firstDayIndex = firstDayIndex === 0 ? 6 : firstDayIndex - 1;

            const totalDays = new Date(year, month + 1, 0).getDate();

            for (let i = 0; i < firstDayIndex; i++) {
                const emptyCell = document.createElement("div");
                emptyCell.classList.add("day-cell", "empty");
                daysGridEl.appendChild(emptyCell);
            }

            const today = new Date();
            for (let day = 1; day <= totalDays; day++) {
                const cell = document.createElement("div");
                cell.classList.add("day-cell");
                cell.textContent = day;

                const formattedMonth = String(month + 1).padStart(2, '0');
                const formattedDay = String(day).padStart(2, '0');
                const dateStr = `${year}-${formattedMonth}-${formattedDay}`;

                if (
                    day === today.getDate() &&
                    month === today.getMonth() &&
                    year === today.getFullYear()
                ) {
                    cell.classList.add("today");
                }

                cell.addEventListener("click", () => {
                    selectedDateStr = dateStr;
                    modalTitle.textContent = `Заметка на ${formattedDay}.${formattedMonth}.${year}`;
                    sendDateInput.value = dateStr;
                    textInput.value = "";
                    fileInput.value = "";
                    modal.classList.add("active");
                });

                daysGridEl.appendChild(cell);
            }
        }

        prevMonthBtn.addEventListener("click", () => {
            currentDate.setMonth(currentDate.getMonth() - 1);
            renderCalendar();
        });

        nextMonthBtn.addEventListener("click", () => {
            currentDate.setMonth(currentDate.getMonth() + 1);
            renderCalendar();
        });

        closeModalBtn.addEventListener("click", () => {
            modal.classList.remove("active");
        });

        saveBookmarkBtn.addEventListener("click", async () => {
            const textVal = textInput.value.trim();
            const sendDateVal = sendDateInput.value;
            const timeVal = timeInput.value;

            if (!textVal) {
                alert("Введите текст закладки!");
                return;
            }

            saveBookmarkBtn.textContent = "Сохранение...";
            saveBookmarkBtn.disabled = true;

            const formData = new FormData();
            formData.append("date", selectedDateStr);
            formData.append("time", timeVal);
            formData.append("send_date", sendDateVal);
            formData.append("priority", selectedPriority);
            formData.append("text", textVal);

            if (fileInput.files.length > 0) {
                formData.append("file", fileInput.files[0]);
            }

            try {
                const response = await fetch(`${BACKEND_URL}/api/send-bookmark`, {
                    method: "POST",
                    body: formData
                });

                const result = await response.json();
                if (response.ok) {
                    alert("Успешно сохранено!");
                    modal.classList.remove("active");
                } else {
                    alert("Ошибка: " + (result.detail || "Не удалось отправить"));
                }
            } catch (error) {
                alert("Ошибка сети.");
                console.error(error);
            } finally {
                saveBookmarkBtn.textContent = "Сохранить";
                saveBookmarkBtn.disabled = false;
            }
        });

        overlayRange.addEventListener("input", (e) => {
            const val = e.target.value;
            overlayVal.textContent = val;
            bgOverlay.style.backgroundColor = `rgba(0, 0, 0, ${val})`;
            localStorage.setItem("app_overlay", val);
        });

        radiusRange.addEventListener("input", (e) => {
            const val = e.target.value;
            radiusVal.textContent = val;
            document.documentElement.style.setProperty('--border-radius', `${val}px`);
            localStorage.setItem("app_radius", val);
        });

        accentColorPicker.addEventListener("input", (e) => {
            const val = e.target.value;
            document.documentElement.style.setProperty('--accent-color', val);
            localStorage.setItem("app_accent", val);
        });

        resetSettingsBtn.addEventListener("click", () => {
            if (confirm("Сбросить все настройки интерфейса и фон?")) {
                localStorage.clear();
                location.reload();
            }
        });

        // Инициализация при запуске
        loadSavedSettings();
        renderCalendar();
    </script>
