<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Календарь закладок</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-color: #f8fafc;
            --accent-color: #38bdf8;
            --accent-hover: #0ea5e9;
            --border-color: #334155;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .calendar-container {
            background-color: var(--card-bg);
            border-radius: 16px;
            padding: 24px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
            width: 380px;
            border: 1px solid var(--border-color);
        }

        .calendar-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .calendar-header h2 {
            margin: 0;
            font-size: 1.25rem;
        }

        .nav-btn {
            background: none;
            border: none;
            color: var(--text-color);
            font-size: 1.2rem;
            cursor: pointer;
            padding: 4px 10px;
            border-radius: 8px;
            transition: background 0.2s;
        }

        .nav-btn:hover {
            background-color: var(--border-color);
        }

        .weekdays {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            text-align: center;
            font-weight: 600;
            font-size: 0.85rem;
            color: #94a3b8;
            margin-bottom: 10px;
        }

        .days-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 6px;
        }

        .day-cell {
            aspect-ratio: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: rgba(255, 255, 255, 0.03);
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.95rem;
            transition: all 0.2s;
            border: 1px solid transparent;
        }

        .day-cell:hover {
            background-color: var(--border-color);
            border-color: var(--accent-color);
        }

        .day-cell.empty {
            pointer-events: none;
            background: none;
        }

        .day-cell.today {
            border-color: var(--accent-color);
            font-weight: bold;
        }

        /* Модальное окно */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(4px);
            justify-content: center;
            align-items: center;
        }

        .modal.active {
            display: flex;
        }

        .modal-content {
            background-color: var(--card-bg);
            padding: 24px;
            border-radius: 14px;
            width: 320px;
            border: 1px solid var(--border-color);
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        .modal-content h3 {
            margin-top: 0;
            margin-bottom: 16px;
            font-size: 1.1rem;
        }

        .form-group {
            margin-bottom: 14px;
        }

        .form-group label {
            display: block;
            font-size: 0.85rem;
            color: #94a3b8;
            margin-bottom: 6px;
        }

        .form-group input, .form-group textarea {
            width: 100%;
            padding: 10px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: inherit;
            box-sizing: border-box;
        }

        .form-group textarea {
            resize: vertical;
            height: 80px;
        }

        .modal-actions {
            display: flex;
            justify-content: flex-end;
            gap: 10px;
            margin-top: 16px;
        }

        .btn {
            padding: 8px 16px;
            border-radius: 8px;
            border: none;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.9rem;
        }

        .btn-cancel {
            background-color: transparent;
            color: #94a3b8;
        }
        .btn-cancel:hover {
            color: var(--text-color);
        }

        .btn-submit {
            background-color: var(--accent-color);
            color: #0f172a;
        }
        .btn-submit:hover {
            background-color: var(--accent-hover);
        }
    </style>
</head>
<body>

    <div class="calendar-container">
        <div class="calendar-header">
            <button class="nav-btn" id="prev-month">&#10094;</button>
            <h2 id="month-year">Месяц Год</h2>
            <button class="nav-btn" id="next-month">&#10095;</button>
        </div>
        <div class="weekdays">
            <div>Пн</div><div>Вт</div><div>Ср</div><div>Чт</div><div>Пт</div><div>Сб</div><div>Вс</div>
        </div>
        <div class="days-grid" id="days-grid"></div>
    </div>

    <!-- Модальное окно для создания закладки -->
    <div class="modal" id="bookmark-modal">
        <div class="modal-content">
            <h3 id="modal-date-title">Заметка на дату</h3>
            <div class="form-group">
                <label for="bookmark-time">Время отправки:</label>
                <input type="time" id="bookmark-time" value="12:00">
            </div>
            <div class="form-group">
                <label for="bookmark-text">Текст закладки:</label>
                <textarea id="bookmark-text" placeholder="Введите текст заметки..."></textarea>
            </div>
            <div class="modal-actions">
                <button class="btn btn-cancel" id="close-modal">Отмена</button>
                <button class="btn btn-submit" id="save-bookmark">Отправить</button>
            </div>
        </div>
    </div>

    <script>
        // ЗАМЕНИ НА СВОЙ URL С RENDER КОГДА ЗАДЕПЛОИШЬ БЭКЕНД
        const BACKEND_URL = "https://your-backend.onrender.com";

        let currentDate = new Date();
        let selectedDateStr = "";

        const monthNames = ["Январь", "Февраль", "Март", "Апрель", "Май", "Июнь", "Июль", "Август", "Сентябрь", "Октябрь", "Ноябрь", "Декабрь"];

        const monthYearEl = document.getElementById("month-year");
        const daysGridEl = document.getElementById("days-grid");
        const prevMonthBtn = document.getElementById("prev-month");
        const nextMonthBtn = document.getElementById("next-month");
        
        const modal = document.getElementById("bookmark-modal");
        const modalTitle = document.getElementById("modal-date-title");
        const closeModalBtn = document.getElementById("close-modal");
        const saveBookmarkBtn = document.getElementById("save-bookmark");
        const timeInput = document.getElementById("bookmark-time");
        const textInput = document.getElementById("bookmark-text");

        function renderCalendar() {
            const year = currentDate.getFullYear();
            const month = currentDate.getMonth();

            monthYearEl.textContent = `${monthNames[month]} ${year}`;
            daysGridEl.innerHTML = "";

            // Первый день месяца (смещение для понедельника)
            let firstDayIndex = new Date(year, month, 1).getDay();
            firstDayIndex = firstDayIndex === 0 ? 6 : firstDayIndex - 1; // Корректировка для Пн

            const totalDays = new Date(year, month + 1, 0).getDate();

            // Пустые ячейки для дней предыдущего месяца
            for (let i = 0; i < firstDayIndex; i++) {
                const emptyCell = document.createElement("div");
                emptyCell.classList.add("day-cell", "empty");
                daysGridEl.appendChild(emptyCell);
            }

            // Дни текущего месяца
            const today = new Date();
            for (let day = 1; day <= totalDays; day++) {
                const cell = document.createElement("div");
                cell.classList.add("day-cell");
                cell.textContent = day;

                const formattedMonth = String(month + 1).padStart(2, '0');
                const formattedDay = String(day).padStart(2, '0');
                const dateStr = `${year}-${formattedMonth}-${formattedDay}`;

                if (
                    day === today.getDate() &&
                    month === today.getMonth() &&
                    year === today.getFullYear()
                ) {
                    cell.classList.add("today");
                }

                cell.addEventListener("click", () => {
                    selectedDateStr = dateStr;
                    modalTitle.textContent = `Заметка на ${formattedDay}.${formattedMonth}.${year}`;
                    textInput.value = "";
                    modal.classList.add("active");
                });

                daysGridEl.appendChild(cell);
            }
        }

        prevMonthBtn.addEventListener("click", () => {
            currentDate.setMonth(currentDate.getMonth() - 1);
            renderCalendar();
        });

        nextMonthBtn.addEventListener("click", () => {
            currentDate.setMonth(currentDate.getMonth() + 1);
            renderCalendar();
        });

        closeModalBtn.addEventListener("click", () => {
            modal.classList.remove("active");
        });

        saveBookmarkBtn.addEventListener("click", async () => {
            const timeVal = timeInput.value;
            const textVal = textInput.value.trim();

            if (!textVal) {
                alert("Пожалуйста, введите текст закладки!");
                return;
            }

            saveBookmarkBtn.textContent = "Отправка...";
            saveBookmarkBtn.disabled = true;

            try {
                const response = await fetch(`${BACKEND_URL}/api/send-bookmark`, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({
                        date: selectedDateStr,
                        time: timeVal,
                        text: textVal
                    })
                });

                const result = await response.json();
                if (response.ok) {
                    alert("Закладка отправлена в Telegram!");
                    modal.classList.remove("active");
                } else {
                    alert("Ошибка: " + (result.detail || "Не удалось отправить"));
                }
            } catch (error) {
                alert("Ошибка сети при обращении к серверу Render.");
                console.error(error);
            } finally {
                saveBookmarkBtn.textContent = "Отправить";
                saveBookmarkBtn.disabled = false;
            }
        });

        renderCalendar();
    </script>
</body>
</html>
