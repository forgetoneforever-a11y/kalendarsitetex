<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Расширенный календарь закладок</title>
    <style>
        :root {
            --bg-color: #0b0f19;
            --card-bg: #111827;
            --text-color: #f3f4f6;
            --accent-color: #6366f1;
            --accent-hover: #4f46e5;
            --border-color: #1f2937;
            
            --priority-high: #ef4444;
            --priority-medium: #f59e0b;
            --priority-low: #10b981;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .calendar-container {
            background-color: var(--card-bg);
            border-radius: 20px;
            padding: 32px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
            width: 520px;
            border: 1px solid var(--border-color);
        }

        .calendar-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
        }

        .calendar-header h2 {
            margin: 0;
            font-size: 1.5rem;
        }

        .nav-btn {
            background: var(--border-color);
            border: none;
            color: var(--text-color);
            font-size: 1.2rem;
            cursor: pointer;
            padding: 8px 16px;
            border-radius: 10px;
            transition: background 0.2s;
        }

        .nav-btn:hover {
            background-color: var(--accent-color);
        }

        .weekdays {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            text-align: center;
            font-weight: 600;
            font-size: 0.95rem;
            color: #9ca3af;
            margin-bottom: 14px;
        }

        .days-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 10px;
        }

        .day-cell {
            aspect-ratio: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background-color: rgba(255, 255, 255, 0.02);
            border-radius: 12px;
            cursor: pointer;
            font-size: 1.1rem;
            transition: all 0.2s;
            border: 1px solid var(--border-color);
        }

        .day-cell:hover {
            background-color: var(--border-color);
            border-color: var(--accent-color);
            transform: translateY(-2px);
        }

        .day-cell.empty {
            pointer-events: none;
            background: none;
            border: none;
        }

        .day-cell.today {
            border-color: var(--accent-color);
            background-color: rgba(99, 102, 241, 0.1);
            font-weight: bold;
        }

        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(6px);
            justify-content: center;
            align-items: center;
        }

        .modal.active {
            display: flex;
        }

        .modal-content {
            background-color: var(--card-bg);
            padding: 28px;
            border-radius: 16px;
            width: 400px;
            border: 1px solid var(--border-color);
            box-shadow: 0 15px 35px rgba(0,0,0,0.6);
        }

        .modal-content h3 {
            margin-top: 0;
            margin-bottom: 18px;
            font-size: 1.3rem;
        }

        .form-group {
            margin-bottom: 16px;
        }

        .form-group label {
            display: block;
            font-size: 0.9rem;
            color: #9ca3af;
            margin-bottom: 6px;
        }

        .form-group input, .form-group textarea {
            width: 100%;
            padding: 10px 12px;
            border-radius: 10px;
            border: 1px solid var(--border-color);
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: inherit;
            box-sizing: border-box;
            font-size: 0.95rem;
        }

        .form-group input[type="file"] {
            padding: 7px;
            cursor: pointer;
        }

        .form-group textarea {
            resize: vertical;
            height: 80px;
        }

        .priority-selector {
            display: flex;
            gap: 10px;
        }

        .priority-option {
            flex: 1;
            padding: 8px;
            text-align: center;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.85rem;
            font-weight: 600;
            border: 1px solid var(--border-color);
            transition: all 0.2s;
        }

        .priority-option.high { color: var(--priority-high); }
        .priority-option.medium { color: var(--priority-medium); }
        .priority-option.low { color: var(--priority-low); }

        .priority-option.selected.high { background-color: var(--priority-high); color: white; }
        .priority-option.selected.medium { background-color: var(--priority-medium); color: white; }
        .priority-option.selected.low { background-color: var(--priority-low); color: white; }

        .modal-actions {
            display: flex;
            justify-content: flex-end;
            gap: 12px;
            margin-top: 20px;
        }

        .btn {
            padding: 10px 18px;
            border-radius: 10px;
            border: none;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.95rem;
        }

        .btn-cancel {
            background-color: transparent;
            color: #9ca3af;
        }
        .btn-cancel:hover { color: var(--text-color); }

        .btn-submit {
            background-color: var(--accent-color);
            color: white;
        }
        .btn-submit:hover { background-color: var(--accent-hover); }
    </style>
</head>
<body>

    <div class="calendar-container">
        <div class="calendar-header">
            <button class="nav-btn" id="prev-month">&#10094;</button>
            <h2 id="month-year">Месяц Год</h2>
            <button class="nav-btn" id="next-month">&#10095;</button>
        </div>
        <div class="weekdays">
            <div>Пн</div><div>Вт</div><div>Ср</div><div>Чт</div><div>Пт</div><div>Сб</div><div>Вс</div>
        </div>
        <div class="days-grid" id="days-grid"></div>
    </div>

    <div class="modal" id="bookmark-modal">
        <div class="modal-content">
            <h3 id="modal-date-title">Новая закладка</h3>
            
            <div class="form-group">
                <label>Важность задачи:</label>
                <div class="priority-selector">
                    <div class="priority-option high selected" data-value="high">Красный</div>
                    <div class="priority-option medium" data-value="medium">Оранжевый</div>
                    <div class="priority-option low" data-value="low">Зеленый</div>
                </div>
            </div>

            <div class="form-group">
                <label for="send-date">Дата отправки боту:</label>
                <input type="date" id="send-date">
            </div>

            <div class="form-group">
                <label for="bookmark-time">Время отправки:</label>
                <input type="time" id="bookmark-time" value="12:00">
            </div>

            <div class="form-group">
                <label for="bookmark-text">Текст закладки:</label>
                <textarea id="bookmark-text" placeholder="Введите текст заметки..."></textarea>
            </div>

            <div class="form-group">
                <label for="file-input">Прикрепить файл с компьютера:</label>
                <input type="file" id="file-input">
            </div>

            <div class="modal-actions">
                <button class="btn btn-cancel" id="close-modal">Отмена</button>
                <button class="btn btn-submit" id="save-bookmark">Отправить в бота</button>
            </div>
        </div>
    </div>

    <script>
        const BACKEND_URL = "https://botkalendar.onrender.com";

        let currentDate = new Date();
        let selectedDateStr = "";
        let selectedPriority = "high";

        const monthNames = ["Январь", "Февраль", "Март", "Апрель", "Май", "Июнь", "Июль", "Август", "Сентябрь", "Октябрь", "Ноябрь", "Декабрь"];

        const monthYearEl = document.getElementById("month-year");
        const daysGridEl = document.getElementById("days-grid");
        const prevMonthBtn = document.getElementById("prev-month");
        const nextMonthBtn = document.getElementById("next-month");
        
        const modal = document.getElementById("bookmark-modal");
        const modalTitle = document.getElementById("modal-date-title");
        const closeModalBtn = document.getElementById("close-modal");
        const saveBookmarkBtn = document.getElementById("save-bookmark");
        
        const sendDateInput = document.getElementById("send-date");
        const timeInput = document.getElementById("bookmark-time");
        const textInput = document.getElementById("bookmark-text");
        const fileInput = document.getElementById("file-input");

        document.querySelectorAll('.priority-option').forEach(option => {
            option.addEventListener('click', () => {
                document.querySelectorAll('.priority-option').forEach(o => o.classList.remove('selected'));
                option.classList.add('selected');
                selectedPriority = option.getAttribute('data-value');
            });
        });

        function renderCalendar() {
            const year = currentDate.getFullYear();
            const month = currentDate.getMonth();

            monthYearEl.textContent = `${monthNames[month]} ${year}`;
            daysGridEl.innerHTML = "";

            let firstDayIndex = new Date(year, month, 1).getDay();
            firstDayIndex = firstDayIndex === 0 ? 6 : firstDayIndex - 1;

            const totalDays = new Date(year, month + 1, 0).getDate();

            for (let i = 0; i < firstDayIndex; i++) {
                const emptyCell = document.createElement("div");
                emptyCell.classList.add("day-cell", "empty");
                daysGridEl.appendChild(emptyCell);
            }

            const today = new Date();
            for (let day = 1; day <= totalDays; day++) {
                const cell = document.createElement("div");
                cell.classList.add("day-cell");
                cell.textContent = day;

                const formattedMonth = String(month + 1).padStart(2, '0');
                const formattedDay = String(day).padStart(2, '0');
                const dateStr = `${year}-${formattedMonth}-${formattedDay}`;

                if (
                    day === today.getDate() &&
                    month === today.getMonth() &&
                    year === today.getFullYear()
                ) {
                    cell.classList.add("today");
                }

                cell.addEventListener("click", () => {
                    selectedDateStr = dateStr;
                    modalTitle.textContent = `Заметка на ${formattedDay}.${formattedMonth}.${year}`;
                    sendDateInput.value = dateStr;
                    textInput.value = "";
                    fileInput.value = "";
                    modal.classList.add("active");
                });

                daysGridEl.appendChild(cell);
            }
        }

        prevMonthBtn.addEventListener("click", () => {
            currentDate.setMonth(currentDate.getMonth() - 1);
            renderCalendar();
        });

        nextMonthBtn.addEventListener("click", () => {
            currentDate.setMonth(currentDate.getMonth() + 1);
            renderCalendar();
        });

        closeModalBtn.addEventListener("click", () => {
            modal.classList.remove("active");
        });

        saveBookmarkBtn.addEventListener("click", async () => {
            const textVal = textInput.value.trim();
            const sendDateVal = sendDateInput.value;
            const timeVal = timeInput.value;

            if (!textVal) {
                alert("Пожалуйста, введите текст закладки!");
                return;
            }

            saveBookmarkBtn.textContent = "Отправка...";
            saveBookmarkBtn.disabled = true;

            const formData = new FormData();
            formData.append("date", selectedDateStr);
            formData.append("time", timeVal);
            formData.append("send_date", sendDateVal);
            formData.append("priority", selectedPriority);
            formData.append("text", textVal);

            if (fileInput.files.length > 0) {
                formData.append("file", fileInput.files[0]);
            }

            try {
                const response = await fetch(`${BACKEND_URL}/api/send-bookmark`, {
                    method: "POST",
                    body: formData
                });

                const result = await response.json();
                if (response.ok) {
                    alert("Заметка и файл успешно отправлены боту!");
                    modal.classList.remove("active");
                } else {
                    alert("Ошибка: " + (result.detail || "Не удалось отправить"));
                }
            } catch (error) {
                alert("Ошибка сети при обращении к серверу Render.");
                console.error(error);
            } finally {
                saveBookmarkBtn.textContent = "Отправить в бота";
                saveBookmarkBtn.disabled = false;
            }
        });

        renderCalendar();
    </script>
</body>
</html>
