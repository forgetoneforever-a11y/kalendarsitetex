<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Универсальный календарь и органайзер</title>
    <style>
        :root {
            --bg-color: rgba(11, 15, 25, 0.85);
            --card-bg: rgba(17, 24, 39, 0.85);
            --text-color: #f3f4f6;
            --accent-color: #6366f1;
            --accent-hover: #4f46e5;
            --border-color: rgba(31, 41, 55, 0.8);
            --border-radius: 24px;
            --font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            --card-shadow: 0 25px 50px rgba(0, 0, 0, 0.7);
            
            --priority-high: #ef4444;
            --priority-medium: #f59e0b;
            --priority-low: #10b981;
        }

        body {
            font-family: var(--font-family);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            box-sizing: border-box;
            position: relative;
            overflow-x: hidden;
            background-size: cover;
            background-position: center;
            background-color: #0b0f19;
        }

        /* Фоновое видео или картинка */
        #bg-media {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: -2;
            display: none;
        }

        /* Затемнение фона */
        #bg-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.5);
            z-index: -1;
            transition: background 0.3s;
        }

        .main-wrapper {
            position: relative;
            width: 100%;
            max-width: 900px;
            box-sizing: border-box;
        }

        .calendar-container {
            position: relative;
            background-color: var(--card-bg);
            backdrop-filter: blur(12px);
            border-radius: var(--border-radius);
            padding: 40px;
            box-shadow: var(--card-shadow);
            width: 100%;
            border: 1px solid var(--border-color);
            box-sizing: border-box;
            transition: box-shadow 0.3s ease;
        }

        /* Класс для неонового свечения блока */
        .calendar-container.neon-glow {
            box-shadow: 0 0 30px var(--accent-color), 0 25px 50px rgba(0, 0, 0, 0.7);
            border-color: var(--accent-color);
        }

        /* Кнопка настроек в самом верхнем правом углу карточки */
        .settings-toggle-btn {
            position: absolute;
            top: 20px;
            right: 20px;
            background-color: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--border-color);
            color: var(--text-color);
            width: 48px;
            height: 48px;
            border-radius: 14px;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            transition: all 0.2s;
            z-index: 5;
        }

        .settings-toggle-btn:hover {
            border-color: var(--accent-color);
            background-color: rgba(99, 102, 241, 0.15);
            transform: scale(1.05);
        }

        .settings-toggle-btn svg {
            width: 24px;
            height: 24px;
            fill: currentColor;
            transition: transform 0.4s ease;
        }

        .settings-toggle-btn.active svg {
            transform: rotate(90deg);
        }

        /* Выпадающая панель настроек */
        .settings-panel {
            display: none;
            position: absolute;
            top: 75px;
            right: 20px;
            background-color: #111827;
            backdrop-filter: blur(16px);
            border-radius: var(--border-radius);
            padding: 24px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.8);
            width: 300px;
            border: 1px solid var(--border-color);
            box-sizing: border-box;
            flex-direction: column;
            gap: 16px;
            z-index: 6;
            animation: fadeIn 0.2s ease-out;
        }

        .settings-panel.active {
            display: flex;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .settings-panel h3 {
            margin: 0 0 5px 0;
            font-size: 1.1rem;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 8px;
        }

        .calendar-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            padding-right: 60px;
        }

        .calendar-header h2 {
            margin: 0;
            font-size: 1.8rem;
        }

        .nav-btn {
            background: var(--border-color);
            border: none;
            color: var(--text-color);
            font-size: 1.2rem;
            cursor: pointer;
            padding: 12px 18px;
            border-radius: 12px;
            transition: background 0.2s;
        }

        .nav-btn:hover {
            background-color: var(--accent-color);
        }

        .weekdays {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            text-align: center;
            font-weight: 600;
            font-size: 1.1rem;
            color: #9ca3af;
            margin-bottom: 16px;
        }

        .days-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 14px;
        }

        .day-cell {
            aspect-ratio: 1.2;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background-color: rgba(255, 255, 255, 0.03);
            border-radius: 14px;
            cursor: pointer;
            font-size: 1.25rem;
            border: 1px solid var(--border-color);
            user-select: none;
            transition: all 0.2s;
        }

        .day-cell:hover {
            border-color: var(--accent-color);
            background-color: rgba(99, 102, 241, 0.15);
        }

        .day-cell.empty {
            pointer-events: none;
            background: none;
            border: none;
        }

        .day-cell.today {
            border-color: var(--accent-color);
            background-color: rgba(99, 102, 241, 0.25);
            font-weight: bold;
        }

        /* Чекбоксы и кастомные переключатели в настройках */
        .checkbox-label {
            display: flex;
            align-items: center;
            gap: 10px;
            cursor: pointer;
            font-size: 0.9rem;
            user-select: none;
        }

        .checkbox-label input {
            cursor: pointer;
            width: 18px;
            height: 18px;
            accent-color: var(--accent-color);
        }

        /* Модальное окно */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(6px);
            justify-content: center;
            align-items: center;
            z-index: 10;
        }

        .modal.active {
            display: flex;
        }

        .modal-content {
            background-color: #111827;
            padding: 24px;
            border-radius: var(--border-radius);
            width: 100%;
            max-width: 420px;
            border: 1px solid var(--border-color);
            box-shadow: 0 15px 35px rgba(0,0,0,0.5);
            box-sizing: border-box;
        }

        .modal-content h3 {
            margin-top: 0;
            margin-bottom: 16px;
            font-size: 1.2rem;
        }

        .form-group {
            margin-bottom: 14px;
        }

        .form-group label {
            display: block;
            font-size: 0.85rem;
            color: #9ca3af;
            margin-bottom: 6px;
        }

        .form-group input, .form-group textarea, .form-group select {
            width: 100%;
            padding: 10px;
            border-radius: 10px;
            border: 1px solid var(--border-color);
            background-color: #0b0f19;
            color: var(--text-color);
            font-family: inherit;
            box-sizing: border-box;
            font-size: 0.95rem;
        }

        .form-group textarea {
            resize: none;
            height: 70px;
        }

        .priority-selector {
            display: flex;
            gap: 8px;
        }

        .priority-option {
            flex: 1;
            padding: 8px 4px;
            text-align: center;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.8rem;
            font-weight: 600;
            border: 1px solid var(--border-color);
        }

        .priority-option.high { color: var(--priority-high); }
        .priority-option.medium { color: var(--priority-medium); }
        .priority-option.low { color: var(--priority-low); }

        .priority-option.selected.high { background-color: var(--priority-high); color: white; }
        .priority-option.selected.medium { background-color: var(--priority-medium); color: white; }
        .priority-option.selected.low { background-color: var(--priority-low); color: white; }

        .modal-actions {
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }

        .btn {
            flex: 1;
            padding: 10px;
            border-radius: 10px;
            border: none;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.95rem;
        }

        .btn-cancel {
            background-color: var(--border-color);
            color: #9ca3af;
        }

        .btn-submit {
            background-color: var(--accent-color);
            color: white;
        }
        
        .btn-submit:hover {
            background-color: var(--accent-hover);
        }

        .btn-reset {
            background-color: rgba(239, 68, 68, 0.2);
            color: #ef4444;
            border: 1px solid rgba(239, 68, 68, 0.4);
            margin-top: 5px;
        }
        .btn-reset:hover {
            background-color: rgba(239, 68, 68, 0.4);
            color: white;
        }
    </style>
</head>
<body>

    <!-- Фоновый элемент (картинка или видео) -->
    <video id="bg-media" autoplay muted loop playsinline></video>
    <div id="bg-overlay"></div>

    <div class="main-wrapper">
        <!-- Широкий блок календаря -->
        <div class="calendar-container" id="calendar-card">
            <!-- Крупная кнопка настроек в самом верхнем правом углу карточки -->
            <button class="settings-toggle-btn" id="settings-toggle" title="Настройки интерфейса">
                <svg viewBox="0 0 24 24">
                    <path d="M19.14,12.94c0.04-0.3,0.06-0.61,0.06-0.94c0-0.32-0.02-0.64-0.07-0.94l2.03-1.58c0.18-0.14,0.23-0.41,0.12-0.61 l-1.92-3.32c-0.12-0.22-0.37-0.29-0.59-0.22l-2.39,0.96c-0.5-0.38-1.03-0.7-1.62-0.94L14.4,2.81c-0.04-0.24-0.24-0.41-0.48-0.41 h-3.84c-0.24,0-0.43,0.17-0.47,0.41L9.25,5.35C8.66,5.59,8.12,5.92,7.63,6.3L5.24,5.34c-0.22-0.08-0.47,0-0.59,0.22L2.73,8.88 c-0.11,0.2-0.06,0.47,0.12,0.61l2.03,1.58c-0.05,0.3-0.09,0.63-0.09,0.94s0.02,0.64,0.07,0.94l-2.03,1.58 c-0.18,0.14-0.23,0.41-0.12,0.61l1.92,3.32c0.12,0.22,0.37,0.29,0.59,0.22l2.39-0.96c0.5,0.38,1.03,0.7,1.62,0.94l0.36,2.54 c0.05,0.24,0.24,0.41,0.48,0.41h3.84c0.24,0,0.44-0.17,0.47-0.41l0.36-2.54c0.59-0.24,1.13-0.56,1.62-0.94l2.39,0.96 c0.22,0.08,0.47,0,0.59-0.22l1.92-3.32c0.12-0.22,0.07-0.47-0.12-0.61L19.14,12.94z M12,15.6c-1.98,0-3.6-1.62-3.6-3.6 s1.62-3.6,3.6-3.6s3.6,1.62,3.6,3.6S13.98,15.6,12,15.6z"/>
                </svg>
            </button>

            <!-- Выпадающая панель настроек -->
            <div class="settings-panel" id="settings-panel">
                <h3>Настройки интерфейса</h3>
                
                <div class="form-group">
                    <label for="bg-file-input">Загрузить фон (Фото / MP4):</label>
                    <input type="file" id="bg-file-input" accept="image/*,video/mp4">
                </div>

                <div class="form-group">
                    <label for="overlay-range">Затемнение фона: <span id="overlay-val">0.5</span></label>
                    <input type="range" id="overlay-range" min="0" max="0.9" step="0.05" value="0.5">
                </div>

                <div class="form-group">
                    <label for="radius-range">Скругление блоков: <span id="radius-val">24</span>px</label>
                    <input type="range" id="radius-range" min="5" max="35" value="24">
                </div>

                <div class="form-group">
                    <label for="accent-color-picker">Цвет акцента:</label>
                    <input type="color" id="accent-color-picker" value="#6366f1">
                </div>

                <div class="form-group">
                    <label for="font-select">Стиль шрифта:</label>
                    <select id="font-select">
                        <option value="'Segoe UI', Tahoma, Geneva, Verdana, sans-serif">Современный (Segoe UI)</option>
                        <option value="'Courier New', Courier, monospace">Киберпанк / Ретро (Monospace)</option>
                        <option value="Georgia, serif">Строгий (Georgia)</option>
                        <option value="'Comic Sans MS', cursive, sans-serif">Игровой / Чиловый</option>
                    </select>
                </div>

                <div class="form-group">
                    <label class="checkbox-label">
                        <input type="checkbox" id="neon-glow-check"> Неоновое свечение блока
                    </label>
                </div>

                <button class="btn btn-reset" id="reset-settings">Сбросить настройки</button>
            </div>

            <div class="calendar-header">
                <button class="nav-btn" id="prev-month">&#10094;</button>
                <h2 id="month-year">Месяц Год</h2>
                <button class="nav-btn" id="next-month">&#10095;</button>
            </div>
            <div class="weekdays">
                <div>Пн</div><div>Вт</div><div>Ср</div><div>Чт</div><div>Пт</div><div>Сб</div><div>Вс</div>
            </div>
            <div class="days-grid" id="days-grid"></div>
        </div>
    </div>

    <!-- Модальное окно -->
    <div class="modal" id="bookmark-modal">
        <div class="modal-content">
            <h3 id="modal-date-title">Новая закладка</h3>
            
            <div class="form-group">
                <label>Важность:</label>
                <div class="priority-selector">
                    <div class="priority-option high selected" data-value="high">Красный</div>
                    <div class="priority-option medium" data-value="medium">Оранж.</div>
                    <div class="priority-option low" data-value="low">Зеленый</div>
                </div>
            </div>

            <div class="form-group">
                <label for="send-date">Дата:</label>
                <input type="date" id="send-date">
            </div>

            <div class="form-group">
                <label for="bookmark-time">Время:</label>
                <input type="time" id="bookmark-time" value="12:00">
            </div>

            <div class="form-group">
                <label for="bookmark-text">Текст:</label>
                <textarea id="bookmark-text" placeholder="Введите текст заметки..."></textarea>
            </div>

            <div class="form-group">
                <label for="file-input">Файл:</label>
                <input type="file" id="file-input">
            </div>

            <div class="modal-actions">
                <button class="btn btn-cancel" id="close-modal">Отмена</button>
                <button class="btn btn-submit" id="save-bookmark">Сохранить</button>
            </div>
        </div>
    </div>

    <script>
        document.addEventListener("DOMContentLoaded", () => {
            const BACKEND_URL = "https://botkalendar.onrender.com";

            let currentDate = new Date();
            let selectedDateStr = "";
            let selectedPriority = "high";

            const monthNames = ["Январь", "Февраль", "Март", "Апрель", "Май", "Июнь", "Июль", "Август", "Сентябрь", "Октябрь", "Ноябрь", "Декабрь"];

            const monthYearEl = document.getElementById("month-year");
            const daysGridEl = document.getElementById("days-grid");
            const prevMonthBtn = document.getElementById("prev-month");
            const nextMonthBtn = document.getElementById("next-month");
            
            const modal = document.getElementById("bookmark-modal");
            const modalTitle = document.getElementById("modal-date-title");
            const closeModalBtn = document.getElementById("close-modal");
            const saveBookmarkBtn = document.getElementById("save-bookmark");
            
            const sendDateInput = document.getElementById("send-date");
            const timeInput = document.getElementById("bookmark-time");
            const textInput = document.getElementById("bookmark-text");
            const fileInput = document.getElementById("file-input");

            const settingsToggleBtn = document.getElementById("settings-toggle");
            const settingsPanel = document.getElementById("settings-panel");
            const bgFileInput = document.getElementById("bg-file-input");
            const bgMedia = document.getElementById("bg-media");
            const bgOverlay = document.getElementById("bg-overlay");
            const overlayRange = document.getElementById("overlay-range");
            const overlayVal = document.getElementById("overlay-val");
            const radiusRange = document.getElementById("radius-range");
            const radiusVal = document.getElementById("radius-val");
            const accentColorPicker = document.getElementById("accent-color-picker");
            const fontSelect = document.getElementById("font-select");
            const neonGlowCheck = document.getElementById("neon-glow-check");
            const calendarCard = document.getElementById("calendar-card");
            const resetSettingsBtn = document.getElementById("reset-settings");

            // Открытие/закрытие панели настроек по клику на шестеренку
            if (settingsToggleBtn && settingsPanel) {
                settingsToggleBtn.addEventListener("click", (e) => {
                    e.stopPropagation();
                    settingsPanel.classList.toggle("active");
                    settingsToggleBtn.classList.toggle("active");
                });

                document.addEventListener("click", (e) => {
                    if (!settingsPanel.contains(e.target) && !settingsToggleBtn.contains(e.target)) {
                        settingsPanel.classList.remove("active");
                        settingsToggleBtn.classList.remove("active");
                    }
                });
            }

            // --- IndexedDB для тяжелых видео ---
            let db;
            const request = indexedDB.open("VideoBgDB", 1);

            request.onupgradeneeded = (e) => {
                db = e.target.result;
                if (!db.objectStoreNames.contains("videos")) {
                    db.createObjectStore("videos");
                }
            };

            request.onsuccess = (e) => {
                db = e.target.result;
                loadSavedSettings();
            };

            function saveVideoToIndexedDB(file) {
                if (!db) return;
                const transaction = db.transaction(["videos"], "readwrite");
                const store = transaction.objectStore("videos");
                store.put(file, "background_video");

                transaction.oncomplete = () => {
                    const fileURL = URL.createObjectURL(file);
                    applyBackground(file.type, fileURL);
                };
            }

            function loadVideoFromIndexedDB() {
                if (!db) return;
                const transaction = db.transaction(["videos"], "readonly");
                const store = transaction.objectStore("videos");
                const getRequest = store.get("background_video");

                getRequest.onsuccess = (e) => {
                    const file = e.target.result;
                    if (file) {
                        const fileURL = URL.createObjectURL(file);
                        applyBackground(file.type, fileURL);
                    }
                };
            }

            function loadSavedSettings() {
                const savedOverlay = localStorage.getItem("app_overlay");
                if (savedOverlay !== null && overlayRange) {
                    overlayRange.value = savedOverlay;
                    if (overlayVal) overlayVal.textContent = savedOverlay;
                    if (bgOverlay) bgOverlay.style.backgroundColor = `rgba(0, 0, 0, ${savedOverlay})`;
                }

                const savedRadius = localStorage.getItem("app_radius");
                if (savedRadius !== null && radiusRange) {
                    radiusRange.value = savedRadius;
                    if (radiusVal) radiusVal.textContent = savedRadius;
                    document.documentElement.style.setProperty('--border-radius', `${savedRadius}px`);
                }

                const savedAccent = localStorage.getItem("app_accent");
                if (savedAccent !== null && accentColorPicker) {
                    accentColorPicker.value = savedAccent;
                    document.documentElement.style.setProperty('--accent-color', savedAccent);
                }

                const savedFont = localStorage.getItem("app_font");
                if (savedFont !== null && fontSelect) {
                    fontSelect.value = savedFont;
                    document.documentElement.style.setProperty('--font-family', savedFont);
                }

                const savedGlow = localStorage.getItem("app_neon_glow");
                if (savedGlow === "true" && neonGlowCheck && calendarCard) {
                    neonGlowCheck.checked = true;
                    calendarCard.classList.add("neon-glow");
                }

                const savedBgType = localStorage.getItem("app_bg_type");
                const savedBgData = localStorage.getItem("app_bg_data");
                if (savedBgType && savedBgData) {
                    applyBackground(savedBgType, savedBgData);
                } else {
                    loadVideoFromIndexedDB();
                }
            }

            function applyBackground(type, url) {
                if (!bgMedia) return;
                if (type.startsWith("video/")) {
                    bgMedia.style.display = "block";
                    document.body.style.backgroundImage = "none";
                    bgMedia.src = url;
                    bgMedia.load();
                    bgMedia.play().catch(err => console.log("Автозапуск:", err));
                } else if (type.startsWith("image/")) {
                    bgMedia.style.display = "none";
                    bgMedia.src = "";
                    document.body.style.backgroundImage = `url('${url}')`;
                }
            }

            if (bgFileInput) {
                bgFileInput.addEventListener("change", (e) => {
                    const file = e.target.files[0];
                    if (!file) return;

                    if (file.type.startsWith("video/")) {
                        localStorage.removeItem("app_bg_type");
                        localStorage.removeItem("app_bg_data");
                        saveVideoToIndexedDB(file);
                    } else if (file.type.startsWith("image/")) {
                        const reader = new FileReader();
                        reader.onload = function(event) {
                            localStorage.setItem("app_bg_type", file.type);
                            localStorage.setItem("app_bg_data", event.target.result);
                            
                            if (db) {
                                const tx = db.transaction(["videos"], "readwrite");
                                tx.objectStore("videos").delete("background_video");
                            }

                            applyBackground(file.type, event.target.result);
                        };
                        reader.readAsDataURL(file);
                    }
                });
            }

            document.querySelectorAll('.priority-option').forEach(option => {
                option.addEventListener('click', () => {
                    document.querySelectorAll('.priority-option').forEach(o => o.classList.remove('selected'));
                    option.classList.add('selected');
                    selectedPriority = option.getAttribute('data-value');
                });
            });

            function renderCalendar() {
                if (!daysGridEl || !monthYearEl) return;
                const year = currentDate.getFullYear();
                const month = currentDate.getMonth();

                monthYearEl.textContent = `${monthNames[month]} ${year}`;
                daysGridEl.innerHTML = "";

                let firstDayIndex = new Date(year, month, 1).getDay();
                firstDayIndex = firstDayIndex === 0 ? 6 : firstDayIndex - 1;

                const totalDays = new Date(year, month + 1, 0).getDate();

                for (let i = 0; i < firstDayIndex; i++) {
                    const emptyCell = document.createElement("div");
                    emptyCell.classList.add("day-cell", "empty");
                    daysGridEl.appendChild(emptyCell);
                }

                const today = new Date();
                for (let day = 1; day <= totalDays; day++) {
                    const cell = document.createElement("div");
                    cell.classList.add("day-cell");
                    cell.textContent = day;

                    const formattedMonth = String(month + 1).padStart(2, '0');
                    const formattedDay = String(day).padStart(2, '0');
                    const dateStr = `${year}-${formattedMonth}-${formattedDay}`;

                    if (
                        day === today.getDate() &&
                        month === today.getMonth() &&
                        year === today.getFullYear()
                    ) {
                        cell.classList.add("today");
                    }

                    cell.addEventListener("click", () => {
                        selectedDateStr = dateStr;
                        if (modalTitle) modalTitle.textContent = `Заметка на ${formattedDay}.${formattedMonth}.${year}`;
                        if (sendDateInput) sendDateInput.value = dateStr;
                        if (textInput) textInput.value = "";
                        if (fileInput) fileInput.value = "";
                        if (modal) modal.classList.add("active");
                    });

                    daysGridEl.appendChild(cell);
                }
            }

            if (prevMonthBtn) {
                prevMonthBtn.addEventListener("click", () => {
                    currentDate.setMonth(currentDate.getMonth() - 1);
                    renderCalendar();
                });
            }

            if (nextMonthBtn) {
                nextMonthBtn.addEventListener("click", () => {
                    currentDate.setMonth(currentDate.getMonth() + 1);
                    renderCalendar();
                });
            }

            if (closeModalBtn && modal) {
                closeModalBtn.addEventListener("click", () => {
                    modal.classList.remove("active");
                });
            }

            if (saveBookmarkBtn) {
                saveBookmarkBtn.addEventListener("click", async () => {
                    const textVal = textInput ? textInput.value.trim() : "";
                    const sendDateVal = sendDateInput ? sendDateInput.value : "";
                    const timeVal = timeInput ? timeInput.value : "12:00";

                    if (!textVal) {
                        alert("Введите текст закладки!");
                        return;
                    }

                    saveBookmarkBtn.textContent = "Сохранение...";
                    saveBookmarkBtn.disabled = true;

                    const formData = new FormData();
                    formData.append("date", selectedDateStr);
                    formData.append("time", timeVal);
                    formData.append("send_date", sendDateVal);
                    formData.append("priority", selectedPriority);
                    formData.append("text", textVal);

                    if (fileInput && fileInput.files.length > 0) {
                        formData.append("file", fileInput.files[0]);
                    }

                    try {
                        const response = await fetch(`${BACKEND_URL}/api/send-bookmark`, {
                            method: "POST",
                            body: formData
                        });

                        const result = await response.json();
                        if (response.ok) {
                            alert("Успешно сохранено!");
                            if (modal) modal.classList.remove("active");
                        } else {
                            alert("Ошибка: " + (result.detail || "Не удалось отправить"));
                        }
                    } catch (error) {
                        alert("Ошибка сети.");
                        console.error(error);
                    } finally {
                        saveBookmarkBtn.textContent = "Сохранить";
                        saveBookmarkBtn.disabled = false;
                    }
                });
            }

            if (overlayRange) {
                overlayRange.addEventListener("input", (e) => {
                    const val = e.target.value;
                    if (overlayVal) overlayVal.textContent = val;
                    if (bgOverlay) bgOverlay.style.backgroundColor = `rgba(0, 0, 0, ${val})`;
                    localStorage.setItem("app_overlay", val);
                });
            }

            if (radiusRange) {
                radiusRange.addEventListener("input", (e) => {
                    const val = e.target.value;
                    if (radiusVal) radiusVal.textContent = val;
                    document.documentElement.style.setProperty('--border-radius', `${val}px`);
                    localStorage.setItem("app_radius", val);
                });
            }

            if (accentColorPicker) {
                accentColorPicker.addEventListener("input", (e) => {
                    const val = e.target.value;
                    document.documentElement.style.setProperty('--accent-color', val);
                    localStorage.setItem("app_accent", val);
                });
            }

            if (fontSelect) {
                fontSelect.addEventListener("change", (e) => {
                    const val = e.target.value;
                    document.documentElement.style.setProperty('--font-family', val);
                    localStorage.setItem("app_font", val);
                });
            }

            if (neonGlowCheck && calendarCard) {
                neonGlowCheck.addEventListener("change", (e) => {
                    const isChecked = e.target.checked;
                    if (isChecked) {
                        calendarCard.classList.add("neon-glow");
                    } else {
                        calendarCard.classList.remove("neon-glow");
                    }
                    localStorage.setItem("app_neon_glow", isChecked);
                });
            }

            if (resetSettingsBtn) {
                resetSettingsBtn.addEventListener("click", () => {
                    if (confirm("Сбросить все настройки интерфейса и фон?")) {
                        localStorage.clear();
                        if (db) {
                            const tx = db.transaction(["videos"], "readwrite");
                            tx.objectStore("videos").clear();
                        }
                        location.reload();
                    }
                });
            }

            renderCalendar();
        });
    </script>
</body>
</html>
