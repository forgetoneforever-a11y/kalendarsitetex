<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Календарь и Расписание</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: #0f1117;
            color: #e2e8f0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .dashboard-container {
            display: flex;
            gap: 30px;
            width: 100%;
            max-width: 1300px;
            background-color: #161b22;
            border: 1px solid #30363d;
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        }

        .sidebar-panel {
            flex: 0 0 280px;
            background-color: #1a212d;
            border: 1px solid #30363d;
            border-radius: 16px;
            padding: 24px;
            display: flex;
            flex-direction: column;
            gap: 16px;
            height: fit-content;
        }

        .nav-button {
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 16px 20px;
            background-color: transparent;
            border: none;
            border-radius: 12px;
            color: #94a3b8;
            font-size: 16px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s ease;
            text-align: left;
            width: 100%;
        }

        .nav-button:hover {
            background-color: rgba(99, 102, 241, 0.1);
            color: #cbd5e1;
        }

        .nav-button.active {
            background-color: #6366f1;
            color: #ffffff;
            box-shadow: 0 4px 12px rgba(99, 102, 241, 0.3);
        }

        .nav-button svg {
            width: 20px;
            height: 20px;
            fill: currentColor;
        }

        .content-panel {
            flex: 1;
            background-color: #1a212d;
            border: 1px solid #30363d;
            border-radius: 16px;
            padding: 36px;
            display: none;
        }

        .content-panel.active {
            display: block;
        }

        .calendar-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
        }

        .calendar-header h2 {
            font-size: 24px;
            font-weight: 600;
            color: #f8fafc;
        }

        .calendar-nav-btn {
            background-color: #21262d;
            border: 1px solid #30363d;
            color: #e2e8f0;
            width: 44px;
            height: 44px;
            border-radius: 12px;
            font-size: 18px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.2s;
        }

        .calendar-nav-btn:hover {
            background-color: #30363d;
        }

        .calendar-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 12px;
        }

        .week-day {
            text-align: center;
            font-size: 15px;
            font-weight: 600;
            color: #64748b;
            padding-bottom: 12px;
        }

        .calendar-day {
            aspect-ratio: 1;
            background-color: #161b22;
            border: 1px solid #30363d;
            border-radius: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
            font-weight: 500;
            color: #cbd5e1;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .calendar-day:hover {
            border-color: #6366f1;
            background-color: rgba(99, 102, 241, 0.05);
        }

        .calendar-day.active {
            background-color: #6366f1;
            color: #ffffff;
            border-color: #6366f1;
            box-shadow: 0 4px 14px rgba(99, 102, 241, 0.4);
        }

        .calendar-day.muted {
            color: #475569;
        }

        .schedule-content h3 {
            font-size: 22px;
            margin-bottom: 20px;
            color: #f8fafc;
        }

        .schedule-list {
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .schedule-item {
            background-color: #161b22;
            border: 1px solid #30363d;
            padding: 16px 20px;
            border-radius: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .schedule-item .time {
            color: #818cf8;
            font-weight: 600;
        }
    </style>
</head>
<body>

    <div class="dashboard-container">
        <!-- Static Sidebar -->
        <div class="sidebar-panel">
            <button class="nav-button active" onclick="switchTab('calendar', this)">
                <svg viewBox="0 0 24 24"><path d="M19 4h-1V2h-2v2H8V2H6v2H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 16H5V10h14v10zm0-12H5V6h14v2z"/></svg>
                Календарь
            </button>
            <button class="nav-button" onclick="switchTab('schedule', this)">
                <svg viewBox="0 0 24 24"><path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-5 14H7v-2h7v2zm3-4H7v-2h10v2zm0-4H7V7h10v2z"/></svg>
                Расписание
            </button>
        </div>

        <!-- Calendar Panel -->
        <div id="calendar-panel" class="content-panel active">
            <div class="calendar-header">
                <button class="calendar-nav-btn">&#10094;</button>
                <h2>Сентябрь 2026</h2>
                <button class="calendar-nav-btn">&#10095;</button>
            </div>

            <div class="calendar-grid" id="calendar-grid">
                <div class="week-day">Пн</div>
                <div class="week-day">Вт</div>
                <div class="week-day">Ср</div>
                <div class="week-day">Чт</div>
                <div class="week-day">Пт</div>
                <div class="week-day">Сб</div>
                <div class="week-day">Св</div>
            </div>
        </div>

        <!-- Schedule Panel -->
        <div id="schedule-panel" class="content-panel">
            <div class="schedule-content">
                <h3>Расписание занятий</h3>
                <div class="schedule-list">
                    <div class="schedule-item">
                        <span>Техническая механика</span>
                        <span class="time">09:00 - 10:30</span>
                    </div>
                    <div class="schedule-item">
                        <span>Детали машин</span>
                        <span class="time">10:45 - 12:15</span>
                    </div>
                    <div class="schedule-item">
                        <span>Материаловедение</span>
                        <span class="time">13:00 - 14:30</span>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Generate calendar days dynamically
        const grid = document.getElementById('calendar-grid');
        
        // Muted days from prev month
        const days = [
            { day: 31, muted: true },
            { day: 1 }, { day: 2 }, { day: 3 }, { day: 4 }, { day: 5 }, { day: 6 },
            { day: 7 }, { day: 8 }, { day: 9 }, { day: 10 }, { day: 11 }, { day: 12, active: true }, { day: 13 },
            { day: 14 }, { day: 15 }, { day: 16 }, { day: 17 }, { day: 18 }, { day: 19 }, { day: 20 },
            { day: 21 }, { day: 22 }, { day: 23 }, { day: 24 }, { day: 25 }, { day: 26 }, { day: 27 },
            { day: 28 }, { day: 29 }, { day: 30 },
            { day: 1, muted: true }, { day: 2, muted: true }, { day: 3, muted: true }, { day: 4, muted: true }
        ];

        days.forEach(item => {
            const el = document.createElement('div');
            el.className = 'calendar-day';
            if (item.muted) el.classList.add('muted');
            if (item.active) el.classList.add('active');
            el.textContent = item.day;
            
            // Click to select day
            el.addEventListener('click', () => {
                document.querySelectorAll('.calendar-day').forEach(d => d.classList.remove('active'));
                el.classList.add('active');
            });

            grid.appendChild(el);
        });

        // Tab switching function
        function switchTab(tabName, btnElement) {
            document.querySelectorAll('.content-panel').forEach(p => p.classList.remove('active'));
            document.querySelectorAll('.nav-button').forEach(b => b.classList.remove('active'));

            if (tabName === 'calendar') {
                document.getElementById('calendar-panel').classList.add('active');
            } else if (tabName === 'schedule') {
                document.getElementById('schedule-panel').classList.add('active');
            }

            btnElement.classList.add('active');
        }
    </script>
</body>
</html>
