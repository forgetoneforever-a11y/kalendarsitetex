<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Расписание — Органайзер</title>
    
    <link rel="stylesheet" href="./css/variables.css">
    <link rel="stylesheet" href="./css/global.css">
    <link rel="stylesheet" href="./css/layout.css">
</head>
<body>

    <!-- Фоновое видео -->
    <video autoplay muted loop id="bgVideo">
        <source src="assets/background.mp4" type="video/mp4">
    </video>
    <div class="video-overlay"></div>

    <!-- Шапка / Навигация -->
    <header class="site-header">
        <div class="header-container">
            <a href="index.html" class="logo">📅 Органайзер</a>
            <nav class="nav-menu">
                <a href="index.html" class="active">Расписание</a>
                <a href="calendar.html">Календарь и Заметки</a>
                <a href="settings.html">Настройки</a>
            </nav>
        </div>
    </header>

    <!-- Основной контент -->
    <main class="site-main">
        <section class="card-glass">
            <h1>Расписание занятий</h1>
            <p class="subtitle">Технология машиностроения — 2 курс</p>
            
            <div class="table-responsive">
                <table class="shedule-table">
                    <thead>
                        <tr>
                            <th>День</th>
                            <th>Время</th>
                            <th>Предмет</th>
                            <th>Аудитория</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr>
                            <td>Понедельник</td>
                            <td>08:30 - 10:00</td>
                            <td>Технология машиностроения</td>
                            <td>Ауд. 204</td>
                        </tr>
                        <tr>
                            <td>Вторник</td>
                            <td>10:15 - 11:45</td>
                            <td>Инженерная графика</td>
                            <td>Ауд. 310</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </section>
    </main>
