<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Календарь и Расписание</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: #0f1117;
            color: #e2e8f0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        /* Main Dashboard Container - wider and static */
        .dashboard-container {
            display: flex;
            gap: 30px;
            width: 100%;
            max-width: 1300px;
            background-color: #161b22;
            border: 1px solid #30363d;
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        }

        /* Static Sidebar Panel */
        .sidebar-panel {
            flex: 0 0 280px;
            background-color: #1a212d;
            border: 1px solid #30363d;
            border-radius: 16px;
            padding: 24px;
            display: flex;
            flex-direction: column;
            gap: 16px;
            height: fit-content;
        }

        .nav-button {
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 16px 20px;
            background-color: transparent;
            border: none;
            border-radius: 12px;
            color: #94a3b8;
            font-size: 16px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s ease;
            text-align: left;
            width: 100%;
        }

        .nav-button:hover {
            background-color: rgba(99, 102, 241, 0.1);
            color: #cbd5e1;
        }

        .nav-button.active {
            background-color: #6366f1;
            color: #ffffff;
            box-shadow: 0 4px 12px rgba(99, 102, 241, 0.3);
        }

        .nav-button svg {
            width: 20px;
            height: 20px;
            fill: currentColor;
        }

        /* Static Content Panel (Calendar) */
        .content-panel {
            flex: 1;
            background-color: #1a212d;
            border: 1px solid #30363d;
            border-radius: 16px;
            padding: 36px;
        }

        .calendar-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
        }

        .calendar-header h2 {
            font-size: 24px;
            font-weight: 600;
            color: #f8fafc;
        }

        .calendar-nav-btn {
            background-color: #21262d;
            border: 1px solid #30363d;
            color: #e2e8f0;
            width: 44px;
            height: 44px;
            border-radius: 12px;
            font-size: 18px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.2s;
        }

        .calendar-nav-btn:hover {
            background-color: #30363d;
        }

        .calendar-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 12px;
        }

        .week-day {
            text-align: center;
            font-size: 15px;
            font-weight: 600;
            color: #64748b;
            padding-bottom: 12px;
        }

        .calendar-day {
            aspect-ratio: 1;
            background-color: #161b22;
            border: 1px solid #30363d;
            border-radius: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
            font-weight: 500;
            color: #cbd5e1;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .calendar-day:hover {
            border-color: #6366f1;
            background-color: rgba(99, 102, 241, 0.05);
        }

        .calendar-day.active {
            background-color: #6366f1;
            color: #ffffff;
            border-color: #6366f1;
            box-shadow: 0 4px 14px rgba(99, 102, 241, 0.4);
        }

        .calendar-day.muted {
            color: #475569;
        }
    </style>
</head>
<body>

    <div class="dashboard-container">
        <!-- Static Sidebar -->
        <div class="sidebar-panel">
            <button class="nav-button active">
                <svg viewBox="0 0 24 24"><path d="M19 4h-1V2h-2v2H8V2H6v2H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 16H5V10h14v10zm0-12H5V6h14v2z"/></svg>
                Календарь
            </button>
            <button class="nav-button">
                <svg viewBox="0 0 24 24"><path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-5 14H7v-2h7v2zm3-4H7v-2h10v2zm0-4H7V7h10v2z"/></svg>
                Расписание
            </button>
        </div>

        <!-- Static Calendar Content -->
        <div class="content-panel">
            <div class="calendar-header">
                <button class="calendar-nav-btn">&#10094;</button>
                <h2>Сентябрь 2026</h2>
                <button class="calendar-nav-btn">&#10095;</button>
            </div>

            <div class="calendar-grid">
                <div class="week-day">Пн</div>
                <div class="week-day">Вт</div>
                <div class="week-day">Ср</div>
                <div class="week-day">Чт</div>
                <div class="week-day">Пт</div>
                <div class="week-day">Сб</div>
                <div class="week-day">Св</div>

                <!-- Days of Sep 2026 -->
                <div class="calendar-day muted">31</div>
                <div class="calendar-day">1</div>
                <div class="calendar-day">2</div>
                <div class="calendar-day">3</div>
                <div class="calendar-day">4</div>
                <div class="calendar-day">5</div>
                <div class="calendar-day">6</div>

                <div class="calendar-day">7</div>
                <div class="calendar-day">8</div>
                <div class="calendar-day">9</div>
                <div class="calendar-day">10</div>
                <div class="calendar-day">11</div>
                <div class="calendar-day active">12</div>
                <div class="calendar-day">13</div>

                <div class="calendar-day">14</div>
                <div class="calendar-day">15</div>
                <div class="calendar-day">16</div>
                <div class="calendar-day">17</div>
                <div class="calendar-day">18</div>
                <div class="calendar-day">19</div>
                <div class="calendar-day">20</div>

                <div class="calendar-day">21</div>
                <div class="calendar-day">22</div>
                <div class="calendar-day">23</div>
                <div class="calendar-day">24</div>
                <div class="calendar-day">25</div>
                <div class="calendar-day">26</div>
                <div class="calendar-day">27</div>

                <div class="calendar-day">28</div>
                <div class="calendar-day">29</div>
                <div class="calendar-day">30</div>
                <div class="calendar-day muted">1</div>
                <div class="calendar-day muted">2</div>
                <div class="calendar-day muted">3</div>
                <div class="calendar-day muted">4</div>
            </div>
        </div>
    </div>

</body>
</html>
