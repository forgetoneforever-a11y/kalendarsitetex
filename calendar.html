<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Календарь — Органайзер</title>
    
    <link rel="stylesheet" href="./css/variables.css">
    <link rel="stylesheet" href="./css/global.css">
    <link rel="stylesheet" href="./css/layout.css">
    <style>
        /* Стили шрифтов */
        body.font-modern { font-family: system-ui, -apple-system, sans-serif; }
        body.font-neon { font-family: 'Courier New', Courier, monospace; letter-spacing: 0.5px; }
        body.font-retro { font-family: 'Lucida Console', Monaco, monospace; text-transform: uppercase; font-size: 0.9rem; }

        /* Динамическое свечение по цветам */
        body.glow-enabled.glow-blue .card-glass, 
        body.glow-enabled.glow-blue .settings-card, 
        body.glow-enabled.glow-blue .calendar-widget {
            border-color: rgba(96, 165, 250, 0.5);
            box-shadow: 0 0 25px rgba(59, 130, 246, 0.35), 0 20px 50px rgba(0, 0, 0, 0.4) !important;
        }
        body.glow-enabled.glow-purple .card-glass, 
        body.glow-enabled.glow-purple .settings-card, 
        body.glow-enabled.glow-purple .calendar-widget {
            border-color: rgba(192, 132, 252, 0.5);
            box-shadow: 0 0 25px rgba(168, 85, 247, 0.35), 0 20px 50px rgba(0, 0, 0, 0.4) !important;
        }
        body.glow-enabled.glow-green .card-glass, 
        body.glow-enabled.glow-green .settings-card, 
        body.glow-enabled.glow-green .calendar-widget {
            border-color: rgba(74, 222, 128, 0.5);
            box-shadow: 0 0 25px rgba(34, 197, 94, 0.35), 0 20px 50px rgba(0, 0, 0, 0.4) !important;
        }
        body.glow-enabled.glow-pink .card-glass, 
        body.glow-enabled.glow-pink .settings-card, 
        body.glow-enabled.glow-pink .calendar-widget {
            border-color: rgba(244, 114, 182, 0.5);
            box-shadow: 0 0 25px rgba(236, 72, 153, 0.35), 0 20px 50px rgba(0, 0, 0, 0.4) !important;
        }

        /* Увеличенный календарь */
        .calendar-widget {
            padding: 28px !important;
        }
        .calendar-day {
            padding: 16px 10px !important;
            text-align: center;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.2s ease;
            color: #f8fafc;
            font-size: 1.05rem !important;
            user-select: none;
            position: relative;
        }
        .calendar-day:hover {
            background: rgba(255, 255, 255, 0.08);
        }
        .calendar-day.other-month {
            color: #475569;
        }
        .calendar-day.today {
            border: 1px dashed #60a5fa;
        }
        .calendar-day.selected {
            background: #3b82f6 !important;
            color: #fff;
            font-weight: bold;
            box-shadow: 0 4px 12px rgba(59, 130, 246, 0.4);
            border: none;
        }
        .calendar-nav-btn {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: #fff;
            padding: 8px 14px;
            border-radius: 8px;
            cursor: pointer;
            transition: background 0.2s;
        }
        .calendar-nav-btn:hover {
            background: rgba(255, 255, 255, 0.15);
        }

        /* Дополнительные стили для времени и загрузки файлов */
        .note-controls-row {
            display: flex;
            gap: 12px;
            margin-bottom: 12px;
            align-items: center;
        }
        .time-input-wrap {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }
        .time-input-wrap label {
            font-size: 0.8rem;
            color: #94a3b8;
        }
        .time-input {
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: #fff;
            padding: 10px;
            border-radius: 8px;
            font-size: 0.95rem;
            outline: none;
            width: 100%;
        }
        .file-upload-btn {
            background: rgba(255, 255, 255, 0.05);
            border: 1px dashed rgba(255, 255, 255, 0.2);
            color: #cbd5e1;
            padding: 10px 14px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.9rem;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: all 0.2s;
            text-align: center;
            justify-content: center;
            flex: 1;
        }
        .file-upload-btn:hover {
            background: rgba(255, 255, 255, 0.1);
            border-color: #60a5fa;
            color: #fff;
        }
        #mediaFile {
            display: none;
        }
        .file-name-preview {
            font-size: 0.8rem;
            color: #60a5fa;
            margin-bottom: 10px;
            word-break: break-all;
        }
    </style>
</head>
<body>

    <video autoplay muted loop id="bgVideo">
        <source src="assets/background.mp4" type="video/mp4">
    </video>
    <div class="video-overlay"></div>

    <header class="site-header">
        <div class="header-container">
            <a href="calendar.html" class="logo">📅 Органайзер</a>
            <nav class="nav-menu">
                <a href="calendar.html" class="active">Календарь и Заметки</a>
                <a href="index.html">Расписание</a>
                <a href="settings.html">Настройки</a>
            </nav>
        </div>
    </header>

    <main class="site-main">
        <section class="card-glass" style="max-width: 1100px;">
            <h1>Календарь и Заметки</h1>
            <p class="subtitle">Выбирай дату и добавляй задачи с отправкой в Telegram.</p>
            
            <div class="calendar-grid-layout" style="display: grid; grid-template-columns: 1.4fr 1fr; gap: 35px; align-items: start;">
                
                <!-- Календарь -->
                <div class="calendar-widget" style="background: rgba(15, 23, 42, 0.4); border-radius: 16px; border: 1px solid rgba(255, 255, 255, 0.06);">
                    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
                        <h3 id="monthYearTitle" style="font-size: 1.25rem; color: #f8fafc;"></h3>
                        <div style="display: flex; gap: 8px;">
                            <button class="calendar-nav-btn" id="prevMonthBtn">&larr;</button>
                            <button class="calendar-nav-btn" id="nextMonthBtn">&rarr;</button>
                        </div>
                    </div>
                    <div style="display: grid; grid-template-columns: repeat(7, 1fr); text-align: center; gap: 8px; font-size: 0.95rem; color: #94a3b8; margin-bottom: 12px;">
                        <span>Пн</span><span>Вт</span><span>Ср</span><span>Чт</span><span>Пт</span><span>Сб</span><span>Вс</span>
                    </div>
                    <div id="calendarDaysGrid" style="display: grid; grid-template-columns: repeat(7, 1fr); gap: 8px;">
                        <!-- Дни генерируются через JS -->
                    </div>
                </div>

                <!-- Блок заметок с временем и медиа -->
                <div class="notes-panel">
                    <h3 id="selectedDateTitle">Заметки на выбранный день</h3>
                    <div id="selectedDateDisplay" style="font-size: 0.9rem; color: #60a5fa; margin-bottom: 12px; font-weight: 500;">Дата не выбрана</div>
                    
                    <!-- Выбор времени -->
                    <div class="note-controls-row">
                        <div class="time-input-wrap">
                            <label for="timeInput">Время выполнения:</label>
                            <input type="time" id="timeInput" class="time-input">
                        </div>
                    </div>

                    <textarea id="noteInput" placeholder="Введите задачу или напоминание..." style="min-height: 130px; margin-bottom: 10px;"></textarea>
                    
                    <!-- Загрузка фото/медиа -->
                    <div class="note-controls-row" style="margin-bottom: 6px;">
                        <label for="mediaFile" class="file-upload-btn">
                            📎 Прикрепить фото/медиа
                        </label>
                        <input type="file" id="mediaFile" accept="image/*,video/*">
                    </div>
                    <div id="fileNamePreview" class="file-name-preview">Файл не выбран</div>

                    <button class="btn-accent" id="sendNoteBtn">Сохранить и отправить в Telegram</button>
                </div>

            </div>
        </section>
    </main>

    <script>
        const savedFont = localStorage.getItem('appFontStyle') || 'modern';
        const savedGlow = localStorage.getItem('appGlow') === 'true';
        const savedGlowColor = localStorage.getItem('appGlowColor') || 'blue';

        document.body.classList.add(`font-${savedFont}`);
        if (savedGlow) {
            document.body.classList.add('glow-enabled');
            document.body.classList.add(`glow-${savedGlowColor}`);
        }

        let currentDate = new Date();
        let selectedDate = new Date();

        const monthNames = ["Январь", "Февраль", "Март", "Апрель", "Май", "Июнь", "Июль", "Август", "Сентябрь", "Октябрь", "Ноябрь", "Декабрь"];

        const monthYearTitle = document.getElementById('monthYearTitle');
        const calendarDaysGrid = document.getElementById('calendarDaysGrid');
        const prevMonthBtn = document.getElementById('prevMonthBtn');
        const nextMonthBtn = document.getElementById('nextMonthBtn');
        const selectedDateDisplay = document.getElementById('selectedDateDisplay');
        const noteInput = document.getElementById('noteInput');
        const timeInput = document.getElementById('timeInput');
        const mediaFile = document.getElementById('mediaFile');
        const fileNamePreview = document.getElementById('fileNamePreview');
        const sendNoteBtn = document.getElementById('sendNoteBtn');

        // Установка текущего времени по умолчанию
        const currentTimeString = new Date().toLocaleTimeString('ru-RU', { hour: '2-digit', minute: '2-digit' });
        timeInput.value = currentTimeString;

        mediaFile.addEventListener('change', () => {
            if (mediaFile.files.length > 0) {
                fileNamePreview.textContent = `Выбран файл: ${mediaFile.files[0].name}`;
            } else {
                fileNamePreview.textContent = 'Файл не выбран';
            }
        });

        function renderCalendar() {
            const year = currentDate.getFullYear();
            const month = currentDate.getMonth();

            monthYearTitle.textContent = `${monthNames[month]} ${year}`;
            calendarDaysGrid.innerHTML = '';

            const firstDayIndex = (new Date(year, month, 1).getDay() + 6) % 7;
            const lastDay = new Date(year, month + 1, 0).getDate();
            const prevLastDay = new Date(year, month, 0).getDate();

            const today = new Date();

            for (let i = firstDayIndex; i > 0; i--) {
                const dayDiv = document.createElement('div');
                dayDiv.textContent = prevLastDay - i + 1;
                dayDiv.className = 'calendar-day other-month';
                calendarDaysGrid.appendChild(dayDiv);
            }

            for (let i = 1; i <= lastDay; i++) {
                const dayDiv = document.createElement('div');
                dayDiv.textContent = i;
                dayDiv.className = 'calendar-day';

                if (i === today.getDate() && month === today.getMonth() && year === today.getFullYear()) {
                    dayDiv.classList.add('today');
                }

                if (i === selectedDate.getDate() && month === selectedDate.getMonth() && year === selectedDate.getFullYear()) {
                    dayDiv.classList.add('selected');
                }

                dayDiv.addEventListener('click', () => {
                    selectedDate = new Date(year, month, i);
                    updateSelectedDateText();
                    renderCalendar();
                });

                calendarDaysGrid.appendChild(dayDiv);
            }

            const totalCells = calendarDaysGrid.children.length;
            const nextDays = totalCells % 7 === 0 ? 0 : 7 - (totalCells % 7);
            for (let i = 1; i <= nextDays; i++) {
                const dayDiv = document.createElement('div');
                dayDiv.textContent = i;
                dayDiv.className = 'calendar-day other-month';
                calendarDaysGrid.appendChild(dayDiv);
            }
        }

        function updateSelectedDateText() {
            const options = { day: 'numeric', month: 'long', year: 'numeric' };
            selectedDateDisplay.textContent = `Выбрано: ${selectedDate.toLocaleDateString('ru-RU', options)}`;
        }

        prevMonthBtn.addEventListener('click', () => {
            currentDate.setMonth(currentDate.getMonth() - 1);
            renderCalendar();
        });

        nextMonthBtn.addEventListener('click', () => {
            currentDate.setMonth(currentDate.getMonth() + 1);
            renderCalendar();
        });

        sendNoteBtn.addEventListener('click', () => {
            const noteText = noteInput.value.trim();
            const taskTime = timeInput.value || 'Не указано';
            const hasFile = mediaFile.files.length > 0;
            const fileName = hasFile ? mediaFile.files[0].name : 'Нет';

            if (!noteText && !hasFile) {
                alert('Введите текст заметки или прикрепите файл!');
                return;
            }

            const dateString = selectedDate.toLocaleDateString('ru-RU');

            const fullMessage = `📅 Дата задачи: ${dateString}\n⏰ Время: ${taskTime}\n📝 Текст: ${noteText || 'Без текста'}\n📎 Медиафайл: ${fileName}`;
            
            console.log("Отправка в Telegram:", fullMessage);
            alert(`Заметка на ${dateString} (${taskTime}) успешно сохранена и отправлена в Telegram!`);
            
            // Сброс формы
            noteInput.value = '';
            mediaFile.value = '';
            fileNamePreview.textContent = 'Файл не выбран';
        });

        updateSelectedDateText();
        renderCalendar();
    </script>
</body>
</html>
