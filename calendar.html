<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Календарь — Texnikum work</title>
    
    <link rel="stylesheet" href="./css/variables.css">
    <link rel="stylesheet" href="./css/global.css">
    <link rel="stylesheet" href="./css/layout.css">
    <style>
        body.font-modern { font-family: system-ui, -apple-system, sans-serif; }
        body.font-neon { font-family: 'Courier New', Courier, monospace; letter-spacing: 0.5px; }
        body.font-retro { font-family: 'Lucida Console', Monaco, monospace; text-transform: uppercase; font-size: 0.9rem; }

        .site-header {
            position: sticky; top: 0; z-index: 50;
            background: rgba(15, 23, 42, 0.45) !important;
            backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.3);
        }
        .header-container { max-width: 1300px; margin: 0 auto; padding: 14px 24px; display: flex; justify-content: space-between; align-items: center; }
        .logo { font-size: 1.1rem; font-weight: 700; color: #f8fafc; text-decoration: none; display: flex; align-items: center; gap: 8px; }
        .nav-menu { display: flex; gap: 8px; }
        .nav-menu a { color: #94a3b8; text-decoration: none; padding: 8px 16px; border-radius: 8px; font-size: 0.9rem; font-weight: 500; transition: all 0.2s; }
        .nav-menu a:hover { color: #fff; background: rgba(255, 255, 255, 0.06); }
        .nav-menu a.active { color: #fff; background: rgba(59, 130, 246, 0.2); border: 1px solid rgba(59, 130, 246, 0.3); }

        .card-glass, .calendar-widget {
            background: rgba(15, 23, 42, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(var(--card-blur, 10px));
            -webkit-backdrop-filter: blur(var(--card-blur, 10px));
        }

        body.glow-enabled.glow-blue .card-glass, body.glow-enabled.glow-blue .calendar-widget {
            border-color: rgba(96, 165, 250, 0.5);
            box-shadow: 0 0 25px rgba(59, 130, 246, 0.35), 0 20px 50px rgba(0, 0, 0, 0.4) !important;
        }
        body.glow-enabled.glow-purple .card-glass, body.glow-enabled.glow-purple .calendar-widget {
            border-color: rgba(192, 132, 252, 0.5);
            box-shadow: 0 0 25px rgba(168, 85, 247, 0.35), 0 20px 50px rgba(0, 0, 0, 0.4) !important;
        }
        body.glow-enabled.glow-green .card-glass, body.glow-enabled.glow-green .calendar-widget {
            border-color: rgba(74, 222, 128, 0.5);
            box-shadow: 0 0 25px rgba(34, 197, 94, 0.35), 0 20px 50px rgba(0, 0, 0, 0.4) !important;
        }
        body.glow-enabled.glow-pink .card-glass, body.glow-enabled.glow-pink .calendar-widget {
            border-color: rgba(244, 114, 182, 0.5);
            box-shadow: 0 0 25px rgba(236, 72, 153, 0.35), 0 20px 50px rgba(0, 0, 0, 0.4) !important;
        }
        body.glow-enabled.glow-custom .card-glass, body.glow-enabled.glow-custom .calendar-widget {
            border-color: var(--custom-glow-border, rgba(59, 130, 246, 0.5));
            box-shadow: 0 0 25px var(--custom-glow-shadow, rgba(59, 130, 246, 0.35)), 0 20px 50px rgba(0, 0, 0, 0.4) !important;
        }

        /* Увеличенный календарь */
        .calendar-widget { padding: 32px !important; border-radius: 18px; }
        
        .calendar-day {
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid rgba(255, 255, 255, 0.07);
            padding: 22px 10px !important;
            text-align: center;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.2s ease;
            color: #f8fafc;
            font-size: 1.15rem !important;
            font-weight: 500;
            user-select: none;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 54px;
        }
        .calendar-day:hover {
            background: rgba(255, 255, 255, 0.08);
            border-color: rgba(255, 255, 255, 0.2);
            transform: translateY(-2px);
        }
        .calendar-day.other-month {
            color: #475569;
            background: rgba(0, 0, 0, 0.15);
            border-color: rgba(255, 255, 255, 0.03);
        }
        .calendar-day.today {
            border: 1px dashed #60a5fa;
        }
        .calendar-day.selected {
            background: linear-gradient(135deg, #3b82f6, #2563eb) !important;
            color: #fff;
            font-weight: bold;
            box-shadow: 0 6px 20px rgba(59, 130, 246, 0.45);
            border-color: transparent !important;
        }
        .calendar-nav-btn {
            background: rgba(255, 255, 255, 0.05); border: 1px solid rgba(255, 255, 255, 0.1);
            color: #fff; padding: 10px 18px; border-radius: 10px; cursor: pointer; transition: all 0.2s; font-size: 1rem;
        }
        .calendar-nav-btn:hover { background: rgba(255, 255, 255, 0.15); border-color: rgba(255, 255, 255, 0.25); }

        .note-controls-row { display: flex; gap: 12px; margin-bottom: 12px; align-items: center; }
        .time-input-wrap { flex: 1; display: flex; flex-direction: column; gap: 4px; }
        .time-input-wrap label { font-size: 0.85rem; color: #94a3b8; }
        .time-input {
            background: rgba(15, 23, 42, 0.6); border: 1px solid rgba(255, 255, 255, 0.1);
            color: #fff; padding: 12px; border-radius: 10px; font-size: 1rem; outline: none; width: 100%;
        }
        .file-upload-btn {
            background: rgba(255, 255, 255, 0.05); border: 1px dashed rgba(255, 255, 255, 0.2);
            color: #cbd5e1; padding: 12px 14px; border-radius: 10px; cursor: pointer; font-size: 0.95rem;
            display: flex; align-items: center; gap: 8px; transition: all 0.2s; text-align: center; justify-content: center; flex: 1;
        }
        .file-upload-btn:hover { background: rgba(255, 255, 255, 0.1); border-color: #60a5fa; color: #fff; }
        #mediaFile { display: none; }
        .file-name-preview { font-size: 0.85rem; color: #60a5fa; margin-bottom: 12px; word-break: break-all; }
    </style>
    <script>
        const savedOpacity = localStorage.getItem('appBgOpacity') ?? '0.85';
        const savedBlur = localStorage.getItem('appBgBlur') || '0';
        const savedCardBlur = localStorage.getItem('appCardBlur') || '10';
        const savedFont = localStorage.getItem('appFontStyle') || 'modern';
        const savedGlow = localStorage.getItem('appGlow') === 'true';
        const savedGlowColor = localStorage.getItem('appGlowColor') || 'blue';
        const savedCustomColor = localStorage.getItem('appCustomGlowColor') || '#3b82f6';

        document.documentElement.style.setProperty('--app-opacity', savedOpacity);
        document.documentElement.style.setProperty('--app-blur', savedBlur + 'px');
        document.documentElement.style.setProperty('--card-blur', savedCardBlur + 'px');

        if (savedGlowColor === 'custom') {
            let r = parseInt(savedCustomColor.slice(1, 3), 16) || 59;
            let g = parseInt(savedCustomColor.slice(3, 5), 16) || 130;
            let b = parseInt(savedCustomColor.slice(5, 7), 16) || 246;
            document.documentElement.style.setProperty('--custom-glow-border', `rgba(${r}, ${g}, ${b}, 0.5)`);
            document.documentElement.style.setProperty('--custom-glow-shadow', `rgba(${r}, ${g}, ${b}, 0.35)`);
        }
    </script>
</head>
<body>
    <script>
        document.body.classList.add(`font-${savedFont}`);
        if (savedGlow && savedGlowColor !== 'none') {
            document.body.classList.add('glow-enabled', `glow-${savedGlowColor}`);
        }
    </script>

    <div id="bgContainer" style="position: fixed; inset: 0; z-index: -2; overflow: hidden; filter: var(--app-blur);"></div>
    <div id="videoOverlay" style="position: fixed; inset: 0; z-index: -1; background: rgba(11, 15, 25, var(--app-opacity));"></div>

    <header class="site-header">
        <div class="header-container">
            <a href="calendar.html" class="logo">💻 Texnikum work</a>
            <nav class="nav-menu">
                <a href="calendar.html" class="active">Календарь и Заметки</a>
                <a href="index.html">Расписание</a>
                <a href="settings.html">Настройки</a>
            </nav>
        </div>
    </header>

    <main class="site-main">
        <section class="card-glass" style="max-width: 1250px; padding: 35px;">
            <h1 style="font-size: 2rem; margin-bottom: 8px;">Календарь и Заметки</h1>
            <p class="subtitle" style="margin-bottom: 25px;">Выбирай дату и добавляй задачи с отправкой в Telegram.</p>
            
            <div class="calendar-grid-layout" style="display: grid; grid-template-columns: 1.5fr 1fr; gap: 40px; align-items: start;">
                
                <div class="calendar-widget" style="background: rgba(15, 23, 42, 0.4); border: 1px solid rgba(255, 255, 255, 0.06);">
                    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px;">
                        <h3 id="monthYearTitle" style="font-size: 1.4rem; color: #f8fafc; margin: 0; font-weight: 600;"></h3>
                        <div style="display: flex; gap: 10px;">
                            <button class="calendar-nav-btn" id="prevMonthBtn">&larr;</button>
                            <button class="calendar-nav-btn" id="nextMonthBtn">&rarr;</button>
                        </div>
                    </div>
                    <div style="display: grid; grid-template-columns: repeat(7, 1fr); text-align: center; gap: 10px; font-size: 1rem; color: #94a3b8; margin-bottom: 14px; font-weight: 600;">
                        <span>Пн</span><span>Вт</span><span>Ср</span><span>Чт</span><span>Пт</span><span>Сб</span><span>Вс</span>
                    </div>
                    <div id="calendarDaysGrid" style="display: grid; grid-template-columns: repeat(7, 1fr); gap: 10px;"></div>
                </div>

                <div class="notes-panel" style="display: flex; flex-direction: column; gap: 12px;">
                    <h3 style="font-size: 1.2rem; color: #fff; margin-bottom: 0;">Заметки на выбранный день</h3>
                    <div id="selectedDateDisplay" style="font-size: 0.95rem; color: #60a5fa; font-weight: 500;">Дата не выбрана</div>
                    
                    <div class="note-controls-row">
                        <div class="time-input-wrap">
                            <label for="timeInput">Время выполнения:</label>
                            <input type="time" id="timeInput" class="time-input">
                        </div>
                    </div>

                    <div style="display: flex; flex-direction: column; gap: 6px;">
                        <label style="font-size: 0.85rem; color: #94a3b8;">Текст задачи:</label>
                        <textarea id="noteInput" placeholder="Введите задачу или напоминание..." style="min-height: 150px; background: rgba(15, 23, 42, 0.6); border: 1px solid rgba(255, 255, 255, 0.1); color: #fff; padding: 14px; border-radius: 10px; font-size: 0.95rem; outline: none; resize: vertical;"></textarea>
                    </div>
                    
                    <div class="note-controls-row" style="margin-bottom: 0;">
                        <label for="mediaFile" class="file-upload-btn">📎 Прикрепить фото/медиа</label>
                        <input type="file" id="mediaFile" accept="image/*,video/*">
                    </div>
                    <div id="fileNamePreview" class="file-name-preview">Файл не выбран</div>

                    <button class="btn-accent" id="sendNoteBtn" style="padding: 14px; border-radius: 10px; font-size: 1rem; cursor: pointer; font-weight: 600;">Сохранить и отправить в Telegram</button>
                </div>
            </div>
        </section>
    </main>

    <script src="./js/app-background.js"></script>
    <script>
        let currentDate = new Date();
        let selectedDate = new Date();
        const monthNames = ["Январь", "Февраль", "Март", "Апрель", "Май", "Июнь", "Июль", "Август", "Сентябрь", "Октябрь", "Ноябрь", "Декабрь"];

        const monthYearTitle = document.getElementById('monthYearTitle');
        const calendarDaysGrid = document.getElementById('calendarDaysGrid');
        const prevMonthBtn = document.getElementById('prevMonthBtn');
        const nextMonthBtn = document.getElementById('nextMonthBtn');
        const selectedDateDisplay = document.getElementById('selectedDateDisplay');
        const noteInput = document.getElementById('noteInput');
        const timeInput = document.getElementById('timeInput');
        const mediaFile = document.getElementById('mediaFile');
        const fileNamePreview = document.getElementById('fileNamePreview');
        const sendNoteBtn = document.getElementById('sendNoteBtn');

        timeInput.value = new Date().toLocaleTimeString('ru-RU', { hour: '2-digit', minute: '2-digit' });

        mediaFile.addEventListener('change', () => {
            fileNamePreview.textContent = mediaFile.files.length > 0 ? `Выбран файл: ${mediaFile.files[0].name}` : 'Файл не выбран';
        });

        function renderCalendar() {
            const year = currentDate.getFullYear();
            const month = currentDate.getMonth();
            monthYearTitle.textContent = `${monthNames[month]} ${year}`;
            calendarDaysGrid.innerHTML = '';

            const firstDayIndex = (new Date(year, month, 1).getDay() + 6) % 7;
            const lastDay = new Date(year, month + 1, 0).getDate();
            const prevLastDay = new Date(year, month, 0).getDate();
            const today = new Date();

            for (let i = firstDayIndex; i > 0; i--) {
                const dayDiv = document.createElement('div');
                dayDiv.textContent = prevLastDay - i + 1;
                dayDiv.className = 'calendar-day other-month';
                calendarDaysGrid.appendChild(dayDiv);
            }

            for (let i = 1; i <= lastDay; i++) {
                const dayDiv = document.createElement('div');
                dayDiv.textContent = i;
                dayDiv.className = 'calendar-day';

                if (i === today.getDate() && month === today.getMonth() && year === today.getFullYear()) {
                    dayDiv.classList.add('today');
                }
                if (i === selectedDate.getDate() && month === selectedDate.getMonth() && year === selectedDate.getFullYear()) {
                    dayDiv.classList.add('selected');
                }

                dayDiv.addEventListener('click', () => {
                    selectedDate = new Date(year, month, i);
                    updateSelectedDateText();
                    renderCalendar();
                });
                calendarDaysGrid.appendChild(dayDiv);
            }

            const totalCells = calendarDaysGrid.children.length;
            const nextDays = totalCells % 7 === 0 ? 0 : 7 - (totalCells % 7);
            for (let i = 1; i <= nextDays; i++) {
                const dayDiv = document.createElement('div');
                dayDiv.textContent = i;
                dayDiv.className = 'calendar-day other-month';
                calendarDaysGrid.appendChild(dayDiv);
            }
        }

        function updateSelectedDateText() {
            selectedDateDisplay.textContent = `Выбрано: ${selectedDate.toLocaleDateString('ru-RU', { day: 'numeric', month: 'long', year: 'numeric' })}`;
        }

        prevMonthBtn.addEventListener('click', () => { currentDate.setMonth(currentDate.getMonth() - 1); renderCalendar(); });
        nextMonthBtn.addEventListener('click', () => { currentDate.setMonth(currentDate.getMonth() + 1); renderCalendar(); });

        sendNoteBtn.addEventListener('click', () => {
            const noteText = noteInput.value.trim();
            const taskTime = timeInput.value || 'Не указано';
            const hasFile = mediaFile.files.length > 0;
            const fileName = hasFile ? mediaFile.files[0].name : 'Нет';

            if (!noteText && !hasFile) {
                alert('Введите текст заметки или прикрепите файл!');
                return;
            }

            const dateString = selectedDate.toLocaleDateString('ru-RU');
            alert(`Заметка на ${dateString} (${taskTime}) успешно сохранена и отправлена в Telegram!`);
            
            noteInput.value = '';
            mediaFile.value = '';
            fileNamePreview.textContent = 'Файл не выбран';
        });

        updateSelectedDateText();
        renderCalendar();
    </script>
</body>
</html>
