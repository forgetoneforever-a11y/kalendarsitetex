<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Календарь — Органайзер</title>
    
    <link rel="stylesheet" href="./css/variables.css">
    <link rel="stylesheet" href="./css/global.css">
    <link rel="stylesheet" href="./css/layout.css">
    <style>
        .calendar-day {
            padding: 10px;
            text-align: center;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s ease;
            color: #f8fafc;
            user-select: none;
        }
        .calendar-day:hover {
            background: rgba(255, 255, 255, 0.08);
        }
        .calendar-day.other-month {
            color: #475569;
        }
        .calendar-day.selected {
            background: #3b82f6 !important;
            color: #fff;
            font-weight: bold;
            box-shadow: 0 4px 12px rgba(59, 130, 246, 0.4);
        }
        .calendar-nav-btn {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: #fff;
            padding: 6px 12px;
            border-radius: 8px;
            cursor: pointer;
            transition: background 0.2s;
        }
        .calendar-nav-btn:hover {
            background: rgba(255, 255, 255, 0.15);
        }
    </style>
</head>
<body>

    <video autoplay muted loop id="bgVideo">
        <source src="assets/background.mp4" type="video/mp4">
    </video>
    <div class="video-overlay"></div>

    <header class="site-header">
        <div class="header-container">
            <a href="index.html" class="logo">📅 Органайзер</a>
            <nav class="nav-menu">
                <a href="index.html">Расписание</a>
                <a href="calendar.html" class="active">Календарь и Заметки</a>
                <a href="settings.html">Настройки</a>
            </nav>
        </div>
    </header>

    <main class="site-main">
        <section class="card-glass">
            <h1>Календарь и Заметки</h1>
            <p class="subtitle">Выбирай дату и добавляй задачи с отправкой в Telegram.</p>
            
            <div class="calendar-grid-layout" style="display: grid; grid-template-columns: 1.2fr 1fr; gap: 30px; align-items: start;">
                
                <!-- Блок интерактивного календаря -->
                <div class="calendar-widget" style="background: rgba(15, 23, 42, 0.4); padding: 20px; border-radius: 16px; border: 1px solid rgba(255, 255, 255, 0.06);">
                    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px;">
                        <h3 id="monthYearTitle" style="font-size: 1.1rem; color: #f8fafc;"></h3>
                        <div style="display: flex; gap: 8px;">
                            <button class="calendar-nav-btn" id="prevMonthBtn">&larr;</button>
                            <button class="calendar-nav-btn" id="nextMonthBtn">&rarr;</button>
                        </div>
                    </div>
                    <div style="display: grid; grid-template-columns: repeat(7, 1fr); text-align: center; gap: 6px; font-size: 0.85rem; color: #94a3b8; margin-bottom: 10px;">
                        <span>Пн</span><span>Вт</span><span>Ср</span><span>Чт</span><span>Пт</span><span>Сб</span><span>Вс</span>
                    </div>
                    <div id="calendarDaysGrid" style="display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; font-size: 0.95rem;">
                        <!-- Дни генерируются через JS -->
                    </div>
                </div>

                <!-- Блок заметок -->
                <div class="notes-panel">
                    <h3 id="selectedDateTitle">Заметки на выбранный день</h3>
                    <div id="selectedDateDisplay" style="font-size: 0.85rem; color: #60a5fa; margin-bottom: 8px; font-weight: 500;">Дата не выбрана</div>
                    <textarea id="noteInput" placeholder="Введите задачу или напоминание..."></textarea>
                    <button class="btn-accent" id="sendNoteBtn">Сохранить и отправить в Telegram</button>
                </div>

            </div>
        </section>
    </main>

    <script>
        let currentDate = new Date();
        let selectedDate = new Date();

        const monthNames = ["Январь", "Февраль", "Март", "Апрель", "Май", "Июнь", "Июль", "Август", "Сентябрь", "Октябрь", "Ноябрь", "Декабрь"];

        const monthYearTitle = document.getElementById('monthYearTitle');
        const calendarDaysGrid = document.getElementById('calendarDaysGrid');
        const prevMonthBtn = document.getElementById('prevMonthBtn');
        const nextMonthBtn = document.getElementById('nextMonthBtn');
        const selectedDateDisplay = document.getElementById('selectedDateDisplay');
        const noteInput = document.getElementById('noteInput');
        const sendNoteBtn = document.getElementById('sendNoteBtn');

        function renderCalendar() {
            const year = currentDate.getFullYear();
            const month = currentDate.getMonth();

            monthYearTitle.textContent = `${monthNames[month]} ${year}`;
            calendarDaysGrid.innerHTML = '';

            // Первый день месяца
            const firstDayIndex = (new Date(year, month, 1).getDay() + 6) % 7;
            // Последний день текущего месяца
            const lastDay = new Date(year, month + 1, 0).getDate();
            // Последний день предыдущего месяца
            const prevLastDay = new Date(year, month, 0).getDate();

            // Дни прошлого месяца
            for (let i = firstDayIndex; i > 0; i--) {
                const dayDiv = document.createElement('div');
                dayDiv.textContent = prevLastDay - i + 1;
                dayDiv.className = 'calendar-day other-month';
                calendarDaysGrid.appendChild(dayDiv);
            }

            // Дни текущего месяца
            for (let i = 1; i <= lastDay; i++) {
                const dayDiv = document.createElement('div');
                dayDiv.textContent = i;
                dayDiv.className = 'calendar-day';

                if (i === selectedDate.getDate() && month === selectedDate.getMonth() && year === selectedDate.getFullYear()) {
                    dayDiv.classList.add('selected');
                }

                dayDiv.addEventListener('click', () => {
                    selectedDate = new Date(year, month, i);
                    updateSelectedDateText();
                    renderCalendar();
                });

                calendarDaysGrid.appendChild(dayDiv);
            }

            // Дни следующего месяца для заполнения сетки
            const totalCells = calendarDaysGrid.children.length;
            const nextDays = totalCells % 7 === 0 ? 0 : 7 - (totalCells % 7);
            for (let i = 1; i <= nextDays; i++) {
                const dayDiv = document.createElement('div');
                dayDiv.textContent = i;
                dayDiv.className = 'calendar-day other-month';
                calendarDaysGrid.appendChild(dayDiv);
            }
        }

        function updateSelectedDateText() {
            const options = { day: 'numeric', month: 'long', year: 'numeric' };
            selectedDateDisplay.textContent = `Выбрано: ${selectedDate.toLocaleDateString('ru-RU', options)}`;
        }

        prevMonthBtn.addEventListener('click', () => {
            currentDate.setMonth(currentDate.getMonth() - 1);
            renderCalendar();
        });

        nextMonthBtn.addEventListener('click', () => {
            currentDate.setMonth(currentDate.getMonth() + 1);
            renderCalendar();
        });

        sendNoteBtn.addEventListener('click', () => {
            const noteText = noteInput.value.trim();
            if (!noteText) {
                alert('Введите текст заметки!');
                return;
            }

            const now = new Date();
            const timeString = now.toLocaleTimeString('ru-RU', { hour: '2-digit', minute: '2-digit' });
            const dateString = selectedDate.toLocaleDateString('ru-RU');

            const fullMessage = `📅 Дата задачи: ${dateString}\n⏰ Время создания: ${timeString}\n📝 Текст: ${noteText}`;
            
            console.log("Отправка в Telegram:", fullMessage);
            alert(`Заметка успешно сохранена на ${dateString} в ${timeString} и отправлена в Telegram!`);
            noteInput.value = '';
        });

        // Инициализация при загрузке
        updateSelectedDateText();
        renderCalendar();
    </script>
</body>
</html>
