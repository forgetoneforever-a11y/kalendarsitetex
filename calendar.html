<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Календарь — Органайзер</title>
    
    <link rel="stylesheet" href="./css/variables.css">
    <link rel="stylesheet" href="./css/global.css">
    <link rel="stylesheet" href="./css/layout.css">
</head>
<body>

    <video autoplay muted loop id="bgVideo">
        <source src="assets/background.mp4" type="video/mp4">
    </video>
    <div class="video-overlay"></div>

    <header class="site-header">
        <div class="header-container">
            <a href="index.html" class="logo">📅 Органайзер</a>
            <nav class="nav-menu">
                <a href="index.html">Расписание</a>
                <a href="calendar.html" class="active">Календарь и Заметки</a>
                <a href="settings.html">Настройки</a>
            </nav>
        </div>
    </header>

    <main class="site-main">
        <section class="card-glass">
            <h1>Календарь и Заметки</h1>
            <p class="subtitle">Выбирай дату и добавляй задачи с отправкой в Telegram.</p>
            
            <div class="calendar-grid-layout" style="display: grid; grid-template-columns: 1.2fr 1fr; gap: 30px; align-items: start;">
                
                <!-- Блок календаря -->
                <div class="calendar-widget" style="background: rgba(15, 23, 42, 0.4); padding: 20px; border-radius: 16px; border: 1px solid rgba(255, 255, 255, 0.06);">
                    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px;">
                        <h3 style="font-size: 1.1rem; color: #f8fafc;">Сентябрь 2026</h3>
                        <div style="display: flex; gap: 8px;">
                            <button style="background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); color: #fff; padding: 6px 12px; border-radius: 8px; cursor: pointer;">&larr;</button>
                            <button style="background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); color: #fff; padding: 6px 12px; border-radius: 8px; cursor: pointer;">&rarr;</button>
                        </div>
                    </div>
                    <div style="display: grid; grid-template-columns: repeat(7, 1fr); text-align: center; gap: 6px; font-size: 0.85rem; color: #94a3b8; margin-bottom: 10px;">
                        <span>Пн</span><span>Вт</span><span>Ср</span><span>Чт</span><span>Пт</span><span>Сб</span><span>Вс</span>
                    </div>
                    <div style="display: grid; grid-template-columns: repeat(7, 1fr); text-align: center; gap: 6px; font-size: 0.95rem;">
                        <!-- Пример сетки дней -->
                        <span style="padding: 10px; color: #475569;">24</span><span style="padding: 10px; color: #475569;">25</span><span style="padding: 10px; color: #475569;">26</span><span style="padding: 10px; color: #475569;">27</span><span style="padding: 10px; color: #475569;">28</span><span style="padding: 10px; color: #475569;">29</span><span style="padding: 10px; color: #475569;">30</span>
                        <span style="padding: 10px; color: #475569;">31</span><span style="padding: 10px; background: rgba(59,130,246,0.15); border-radius: 8px; color: #60a5fa;">1</span><span style="padding: 10px;">2</span><span style="padding: 10px;">3</span><span style="padding: 10px;">4</span><span style="padding: 10px;">5</span><span style="padding: 10px;">6</span>
                        <span style="padding: 10px;">7</span><span style="padding: 10px;">8</span><span style="padding: 10px;">9</span><span style="padding: 10px;">10</span><span style="padding: 10px;">11</span><span style="padding: 10px;">12</span><span style="padding: 10px; background: #3b82f6; border-radius: 8px; color: #fff; font-weight: bold;">13</span>
                        <span style="padding: 10px;">14</span><span style="padding: 10px;">15</span><span style="padding: 10px;">16</span><span style="padding: 10px;">17</span><span style="padding: 10px;">18</span><span style="padding: 10px;">19</span><span style="padding: 10px;">20</span>
                    </div>
                </div>

                <!-- Блок заметок -->
                <div class="notes-panel">
                    <h3>Заметки на выбранный день</h3>
                    <textarea id="noteInput" placeholder="Введите задачу или напоминание..."></textarea>
                    <button class="btn-accent" id="sendNoteBtn">Сохранить и отправить в Telegram</button>
                </div>

            </div>
        </section>
    </main>

</body>
</html>
