<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Календарь — Органайзер</title>
    
    <link rel="stylesheet" href="./css/variables.css">
    <link rel="stylesheet" href="./css/global.css">
    <link rel="stylesheet" href="./css/layout.css">
</head>
<body>

    <video autoplay muted loop id="bgVideo">
        <source src="assets/background.mp4" type="video/mp4">
    </video>
    <div class="video-overlay"></div>

    <header class="site-header">
        <div class="container header-container">
            <a href="index.html" class="logo">📅 Органайзер</a>
            <nav class="nav-menu">
                <a href="index.html">Расписание</a>
                <a href="calendar.html" class="active">Календарь и Заметки</a>
                <a href="settings.html">Настройки</a>
            </nav>
        </div>
    </header>

    <main class="site-main container">
        <section class="card-glass">
            <h1>Календарь и Заметки</h1>
            <p class="subtitle">Выбирай дату и добавляй задачи с отправкой в Telegram.</p>
            
            <div class="calendar-grid-layout">
                <div class="mini-calendar" id="calendarWidget">
                    <!-- Сетка календаря -->
                </div>
                <div class="notes-panel">
                    <h3>Заметки на день</h3>
                    <textarea id="noteInput" placeholder="Введите задачу или напоминание..."></textarea>
                    <button class="btn-accent" id="sendNoteBtn">Сохранить и отправить в Telegram</button>
                </div>
            </div>
        </section>
    </main>

</body>
</html>
