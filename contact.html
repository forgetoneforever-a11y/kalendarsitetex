<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Контакты — Мой проект</title>
    
    <link rel="stylesheet" href="./css/variables.css">
    <link rel="stylesheet" href="./css/global.css">
    <link rel="stylesheet" href="./css/layout.css">
    <link rel="stylesheet" href="./css/pages/contact.css">
</head>
<body>

    <header class="site-header">
        <div class="container header-container">
            <a href="index.html" class="logo">🚀 МойПроект</a>
            <nav class="nav-menu">
                <a href="index.html">Главная</a>
                <a href="about.html">О нас</a>
                <a href="schedule.html">Расписание</a>
                <a href="contact.html" class="active">Контакты</a>
            </nav>
            <button class="burger-menu" id="burgerBtn" aria-label="Открыть меню">
                <span></span>
                <span></span>
                <span></span>
            </button>
        </div>
    </header>

    <main class="site-main">
        <section class="page-header">
            <div class="container">
                <h1>Свяжитесь с нами</h1>
                <p>Оставьте сообщение, и мы ответим в ближайшее время.</p>
            </div>
        </section>

        <section class="content-section">
            <div class="container contact-container">
                <form class="contact-form" id="contactForm">
                    <div class="form-group">
                        <label for="name">Ваше имя</label>
                        <input type="text" id="name" required placeholder="Иван">
                    </div>
                    <div class="form-group">
                        <label for="email">Электронная почта</label>
                        <input type="email" id="email" required placeholder="example@domain.com">
                    </div>
                    <div class="form-group">
                        <label for="message">Сообщение</label>
                        <textarea id="message" rows="5" required placeholder="Ваше сообщение..."></textarea>
                    </div>
                    <button type="submit" class="btn-primary">Отправить сообщение</button>
                    <p class="form-status" id="formStatus"></p>
                </form>
            </div>
        </section>
    </main>

    <footer class="site-footer">
        <div class="container footer-container">
            <p>&copy; 2026 МойПроект. Все права защищены.</p>
        </div>
    </footer>

    <script src="./js/main.js"></script>
    <script src="./js/pages/contact.js"></script>
</body>
</html>
